<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>奇可智能打卡系統</title>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root {
    --bg-color: #f0f4f8;
    --card-bg: #ffffff;
    --text-main: #2c3e50;
    --text-sub: #7f8c8d;
    --start-gradient: linear-gradient(135deg, #ff9f43, #ee5253);
    --end-gradient: linear-gradient(135deg, #3498db, #2980b9);
    --approve-gradient: linear-gradient(145deg, #8e44ad, #663399);
}
body {
    font-family: "Arial", "Noto Sans TC", sans-serif;
    background: var(--bg-color);
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    color: var(--text-main);
}
.app-container {
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    background: var(--bg-color);
    display: flex;
    flex-direction: column;
    box-sizing: border-box;
    padding: 16px 16px 32px 16px;
    gap: 16px;
}
.app-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 4px;
}
.user-profile-container {
    display: flex;
    align-items: center;
    gap: 12px;
}
.user-avatar {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: linear-gradient(135deg, #6c5ce7, #a29bfe);
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 20px;
    font-weight: bold;
    box-shadow: 0 4px 10px rgba(108, 92, 231, 0.3);
    flex-shrink: 0;
    overflow: hidden;
}
.user-profile {
    display: flex;
    flex-direction: column;
    gap: 2px;
}
#userInfo {
    font-size: 20px;
    font-weight: bold;
    color: var(--text-main);
}
.app-subtitle {
    font-size: 14px;
    font-weight: bold;
    color: var(--text-sub);
}
#statusInfo {
    font-size: 14px;
    font-weight: bold;
    color: white;
    padding: 6px 14px;
    border-radius: 20px;
    background: #95a5a6;
    text-align: center;
    white-space: nowrap;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    flex-shrink: 0;
}
.dashboard-card {
    background: var(--card-bg);
    border-radius: 20px;
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    box-shadow: 0 15px 30px rgba(0,0,0,0.15);
}
.clock-container {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: linear-gradient(145deg, #f8fafc, #edf2f7);
    padding: 14px 20px;
    border-radius: 16px;
    box-shadow: inset 0 2px 5px rgba(0,0,0,0.05), 0 4px 12px rgba(0,0,0,0.03);
    border: 1px solid #e2e8f0;
}
.time-box {
    background: #ffffff;
    padding: 8px 12px;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
    border: 1px solid #edf2f7;
}
#timeHour,
#timeMin,
#timeSec {
    font-size: 38px;
    font-weight: normal;
    color: var(--text-main);
    font-family: "Courier New", Courier, monospace;
    letter-spacing: 1px;
}
.time-separator {
    font-size: 32px;
    font-weight: normal;
    color: #a0aec0;
    padding-bottom: 4px;
    animation: pulseSeparator 1.5s infinite;
}
@keyframes pulseSeparator {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
}
.buttons-container {
    display: flex;
    gap: 15px;
    width: 100%;
}
.buttons-container button {
    flex: 1;
    padding: 15px 0;
    font-size: 22px;
    font-weight: bold;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    color: white;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    transition: all 0.2s;
}
#btnStart {
    background: var(--start-gradient);
}
#btnEnd {
    background: var(--end-gradient);
}
button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    box-shadow: none !important;
    transform: none !important;
}
button:not(:disabled):active {
    transform: scale(0.97);
}
.section-container {
    background: var(--card-bg);
    border-radius: 16px;
    padding: 18px;
    box-shadow: 0 10px 20px rgba(0,0,0,0.08);
    border: 1px solid #ddd;
}
.section-title {
    font-size: 16px;
    font-weight: bold;
    color: var(--text-main);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
}
#todayRecords {
    display: flex;
    flex-direction: column;
    gap: 8px;
}
.record-item {
    background: #fafafa;
    border-radius: 10px;
    padding: 12px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-left: 4px solid #3498db;
    box-sizing: border-box;
    font-size: 16px;
}
.record-info {
    display: flex;
    flex-direction: column;
    gap: 2px;
}
.record-status {
    font-size: 16px;
    font-weight: bold;
    color: #2c3e50;
}
.record-details {
    font-size: 12px;
    color: #7f8c8d;
}
.record-time {
    font-size: 18px;
    font-weight: bold;
    color: #2c3e50;
}
.badge-makeup {
    background: #e67e22;
    color: white;
    font-size: 11px;
    padding: 2px 6px;
    border-radius: 6px;
    margin-left: 4px;
    vertical-align: middle;
}
.records-empty {
    text-align: center;
    color: var(--text-sub);
    font-size: 15px;
    padding: 15px 0;
}
#btnApprove {
    padding: 14px 20px;
    font-size: 18px;
    font-weight: bold;
    border-radius: 10px;
    background: var(--approve-gradient);
    color: white;
    display: none;
    width: 100%;
    cursor: pointer;
    border: none;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    transition: all 0.2s;
}
#btnApprove:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 15px rgba(0,0,0,0.15);
}
@keyframes bounce {
    0% { transform: scale(1); }
    30% { transform: scale(1.1); }
    50% { transform: scale(0.95); }
    70% { transform: scale(1.05); }
    100% { transform: scale(1); }
}
.bounce {
    animation: bounce 0.4s ease;
}
.swal2-popup.custom-swal-popup {
    border-radius: 20px !important;
    padding: 24px !important;
    font-family: "Arial", "Noto Sans TC", sans-serif !important;
    box-shadow: 0 20px 40px rgba(0,0,0,0.2) !important;
}
.swal2-title {
    font-size: 22px !important;
    color: #2c3e50 !important;
    font-weight: bold !important;
}
.swal2-html-container {
    font-size: 16px !important;
    color: #555 !important;
}
.swal2-styled.swal2-confirm {
    background: linear-gradient(135deg, #3498db, #2980b9) !important;
    border-radius: 10px !important;
    font-size: 16px !important;
    font-weight: bold !important;
    padding: 10px 24px !important;
    box-shadow: 0 4px 12px rgba(52, 152, 219, 0.3) !important;
}
#countdownWrapper {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(255, 255, 255, 0.85);
    z-index: 9999;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}
#circleProgress {
    fill: none;
    stroke-width: 12;
    stroke-linecap: round;
}
#countdownText {
    margin-top: 15px;
    font-size: 16px;
    font-weight: bold;
    color: #2c3e50;
    white-space: nowrap;
}
</style>
</head>
<body>
<div class="app-container">
    <!-- 頂部資訊列 -->
    <div class="app-header">
        <div class="user-profile-container">
            <div class="user-avatar" id="userAvatar">👤</div>
            <div class="user-profile">
                <div id="userInfo">載入中...</div>
                <div class="app-subtitle" id="headerDate">載入日期中...</div>
            </div>
        </div>
        <div id="statusInfo">檢查中...</div>
    </div>
    <!-- 打卡儀表板 -->
    <div class="dashboard-card">
        <div class="clock-container">
            <div class="time-box">
                <span id="timeHour">00</span>
            </div>
            <span class="time-separator">:</span>
            <div class="time-box">
                <span id="timeMin">00</span>
            </div>
            <span class="time-separator">:</span>
            <div class="time-box">
                <span id="timeSec">00</span>
            </div>
        </div>
        <div class="buttons-container">
            <button id="btnStart" disabled>上班</button>
            <button id="btnEnd" disabled>下班</button>
        </div>
    </div>
    <!-- 倒數動畫 -->
    <div id="countdownWrapper">
        <svg width="120" height="120">
            <circle cx="60" cy="60" r="50" stroke="#eee" stroke-width="12" fill="none"></circle>
            <circle id="circleProgress" cx="60" cy="60" r="50" stroke="#3498db" stroke-width="12" fill="none" transform="rotate(-90 60 60)"></circle>
        </svg>
        <div id="countdownText">打卡中...</div>
    </div>
    <!-- 今日紀錄 -->
    <div class="section-container">
        <div class="section-title" onclick="refreshTodayRecords()">📋 今日打卡紀錄</div>
        <div id="todayRecords" class="records-empty">正在載入紀錄…</div>
    </div>
    <!-- 主管簽核 -->
    <button id="btnApprove">補打卡審批</button>
</div>
<script>
// ============================================================
// 1. 系統設定
// ============================================================

const API_ENDPOINT = "https://script.google.com/macros/s/AKfycbzJoMudQ8id5CNUfJHf8rDL8VATfXcg51MZgvgzVd3FM79E3tOgs7dBWlf1SZL1zAxW/exec";
const COMPANY_IPS  = ["60.248.152.159"];

const MANAGERS = [
    "U76174e2a9654ab2c7b1f037b28cb6c86",
    "U7fdf4fbd467b9a93a23fac01ed03351b"
];

const LIFF_ID = "2009435359-2rSzV0kR";

// ============================================================
// 2. DOM
// ============================================================
const userInfo = document.getElementById("userInfo");
const userAvatar = document.getElementById("userAvatar");
const statusInfo = document.getElementById("statusInfo");
const headerDate = document.getElementById("headerDate");
const btnStart = document.getElementById("btnStart");
const btnEnd = document.getElementById("btnEnd");
const btnApprove = document.getElementById("btnApprove");
const todayRecords = document.getElementById("todayRecords");

// ============================================================
// 3. 全域狀態
// ============================================================
window.userReady = false;
window.userId = "";
window.userName = "";
window.currentIP = "";
window.isClocking = false;

// ============================================================
// 4. 日期時間
// ============================================================
function updateDateTime() {
    const now = new Date();
    const hour = document.getElementById("timeHour");
    const min = document.getElementById("timeMin");
    const sec = document.getElementById("timeSec");

    if (hour) {
        hour.textContent = String(now.getHours()).padStart(2, "0");
    }
    if (min) {
        min.textContent = String(now.getMinutes()).padStart(2, "0");
    }
    if (sec) {
        sec.textContent = String(now.getSeconds()).padStart(2, "0");
    }
    if (headerDate) {
        const dateStr = now.toLocaleDateString("zh-TW", {
            year: "numeric",
            month: "2-digit",
            day: "2-digit"
        });
        const weekdayStr = now.toLocaleDateString("zh-TW", {
            weekday: "long"
        });
        headerDate.textContent = `${dateStr} (${weekdayStr})`;
    }
}

setInterval(updateDateTime, 1000);
updateDateTime();

// ============================================================
// 5. 今日日期
// ============================================================
function getTodayString() {
    const now = new Date();
    return now.toLocaleDateString("zh-TW", {
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
    }).replace(/\//g, "/");
}

// ============================================================
// 6. 取得 IP
// ============================================================
async function getIP() {
    if (window.currentIP) {
        return window.currentIP;
    }

    const cache = sessionStorage.getItem("myIP");
    if (cache) {
        window.currentIP = cache;
        return cache;
    }

    try {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 5000);

        const res = await fetch("https://api.ipify.org?format=json", {
            signal: controller.signal,
            cache: "no-store"
        });

        clearTimeout(timeout);

        if (!res.ok) {
            throw new Error("IP API response error");
        }

        const data = await res.json();
        const ip = data.ip || "";

        if (ip) {
            window.currentIP = ip;
            sessionStorage.setItem("myIP", ip);
        }

        return ip;
    } catch (err) {
        console.warn("取得 IP 失敗:", err);
        return "";
    }
}

// ============================================================
// 7. 時間格式
// ============================================================
function fixTimeFormat(t) {
    if (typeof t === "string" && t.includes(":") && !t.includes("T")) {
        return t;
    }
    if (typeof t === "string" && t.includes("T")) {
        return new Date(t).toLocaleTimeString("zh-TW", {
            hour12: false
        });
    }
    if (!isNaN(t)) {
        const d = new Date((t - 25569) * 86400 * 1000);
        return d.toLocaleTimeString("zh-TW", {
            hour12: false
        });
    }
    return t || "";
}

// ============================================================
// 8. 初始化 LIFF + 使用者資訊
// ============================================================
async function updateUserInfo() {
    try {
        const liffPromise = liff.init({
            liffId: LIFF_ID
        });
        const ipPromise = getIP();

        await liffPromise;
        const initialIP = await ipPromise;

        if (!liff.isLoggedIn()) {
            await liff.login();
            return;
        }

        const profile = await liff.getProfile();
        window.userId = profile.userId || "";
        window.userName = profile.displayName || "未知用戶";

        if (userInfo) {
            userInfo.textContent = `${window.userName} 您好`;
        }

        if (profile.pictureUrl && userAvatar) {
            userAvatar.innerHTML = `<img src="${profile.pictureUrl}" alt="avatar" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`;
        } else if (window.userName && userAvatar) {
            userAvatar.textContent = window.userName.charAt(0);
        }

        if (btnApprove) {
            btnApprove.style.display = MANAGERS.includes(window.userId) ? "block" : "none";
        }

        const isCompany = COMPANY_IPS.includes(initialIP);
        if (statusInfo) {
            statusInfo.textContent = isCompany ? "公司網路" : "非公司網路";
            statusInfo.style.background = isCompany ? "#2ecc71" : "#e74c3c";
        }

        window.userReady = true;

        if (btnStart) {
            btnStart.disabled = false;
        }
        if (btnEnd) {
            btnEnd.disabled = false;
        }
    } catch (err) {
        console.error("updateUserInfo error:", err);
        window.userReady = false;

        Swal.fire({
            icon: "error",
            title: "系統初始化失敗",
            text: "請重新整理頁面後再試一次。",
            confirmButtonText: "確定",
            customClass: {
                popup: "custom-swal-popup"
            }
        });
    }
}

// ============================================================
// 9. 更新網路狀態
// ============================================================
function updateNetworkStatus(ip) {
    const isCompany = COMPANY_IPS.includes(ip);
    if (statusInfo) {
        statusInfo.textContent = isCompany ? "公司網路" : "非公司網路";
        statusInfo.style.background = isCompany ? "#2ecc71" : "#e74c3c";
    }
    return isCompany;
}

// ============================================================
// 10. 建立單筆紀錄 HTML
// ============================================================
function createRecordHTML(r) {
    const status = r.status || "";
    const color = status === "下班" ? "#2ecc71" : "#3498db";
    const time = fixTimeFormat(r.time);
    const isCompany = COMPANY_IPS.includes(r.ip);
    const networkLabel = isCompany ? "公司網路" : "異地打卡";
    const networkColor = isCompany ? "#7f8c8d" : "#e67e22";
    const makeupBadge = r.isMakeup ? `<span class="badge-makeup">待審核</span>` : "";

    return `
        <div class="record-item" style="border-left-color:${color};">
            <div class="record-info">
                <div class="record-status">
                    ${status}
                    ${makeupBadge}
                </div>
                <div class="record-details" style="color:${networkColor};">
                    ${networkLabel}
                </div>
            </div>
            <div class="record-time" style="color:${color};">
                ${time}
            </div>
        </div>
    `;
}

// ============================================================
// 11. 取得今日紀錄
// ============================================================
async function updateTodayRecords() {
    if (!window.userId) {
        return;
    }

    const today = getTodayString();

    try {
        const url = `${API_ENDPOINT}?action=getToday&userId=${encodeURIComponent(window.userId)}&date=${encodeURIComponent(today)}`;
        const res = await fetch(url, {
            method: "GET",
            cache: "no-store"
        });

        if (!res.ok) {
            throw new Error(`HTTP ${res.status}`);
        }

        const data = await res.json();

        if (!Array.isArray(data) || data.length === 0) {
            todayRecords.innerHTML = `<div class="records-empty">今日尚無打卡紀錄</div>`;
            return;
        }

        todayRecords.innerHTML = data.map(createRecordHTML).join("");
    } catch (err) {
        console.error("今日紀錄讀取失敗:", err);

        if (!todayRecords.innerHTML || todayRecords.innerHTML.includes("正在載入紀錄")) {
            todayRecords.innerHTML = `<div class="records-empty" style="color:#e74c3c;">今日打卡紀錄讀取失敗</div>`;
        }
    }
}

// ============================================================
// 12. 手動重新整理今日紀錄
// ============================================================
function refreshTodayRecords() {
    const container = document.querySelector(".section-container");
    if (container) {
        container.classList.add("bounce");
        setTimeout(() => {
            container.classList.remove("bounce");
        }, 400);
    }
    updateTodayRecords();
}

// ============================================================
// 13. 立即把新打卡紀錄放到畫面
// ============================================================
function addRecordImmediately(record) {
    if (!todayRecords) {
        return;
    }

    if (todayRecords.innerHTML.includes("今日尚無打卡紀錄") || todayRecords.innerHTML.includes("正在載入紀錄")) {
        todayRecords.innerHTML = "";
    }

    const html = createRecordHTML(record);
    todayRecords.insertAdjacentHTML("afterbegin", html);

    const firstItem = todayRecords.firstElementChild;
    if (firstItem) {
        firstItem.classList.add("bounce");
        setTimeout(() => {
            firstItem.classList.remove("bounce");
        }, 400);
    }
}

// ============================================================
// 14. 倒數圓環
// ============================================================
function startClockAnimation(status, isMakeup) {
    const wrapper = document.getElementById("countdownWrapper");
    const circle = document.getElementById("circleProgress");
    const text = document.getElementById("countdownText");

    if (!wrapper || !circle || !text) {
        return Promise.resolve();
    }

    wrapper.style.display = "flex";
    wrapper.style.opacity = "1";
    text.textContent = isMakeup ? "補打卡中..." : "打卡中...";

    const radius = 50;
    const circumference = 2 * Math.PI * radius;
    circle.style.strokeDasharray = circumference;
    circle.style.strokeDashoffset = circumference;

    const colors = {
        上班: {
            start: { r: 52, g: 152, b: 219 },
            end: { r: 41, g: 128, b: 185 }
        },
        下班: {
            start: { r: 46, g: 204, b: 113 },
            end: { r: 39, g: 174, b: 96 }
        },
        補打卡: {
            start: { r: 243, g: 156, b: 18 },
            end: { r: 243, g: 156, b: 18 }
        }
    };

    const color = isMakeup ? colors.補打卡 : (colors[status] || colors.上班);
    const startColor = color.start;
    const endColor = color.end;

    return new Promise(resolve => {
        let progress = 0;

        function animate() {
            progress = Math.min(progress + 0.025, 1);
            circle.style.strokeDashoffset = circumference * (1 - progress);

            const r = Math.round(startColor.r * (1 - progress) + endColor.r * progress);
            const g = Math.round(startColor.g * (1 - progress) + endColor.g * progress);
            const b = Math.round(startColor.b * (1 - progress) + endColor.b * progress);

            circle.style.stroke = `rgb(${r},${g},${b})`;

            if (progress < 1) {
                requestAnimationFrame(animate);
            } else {
                wrapper.style.transition = "opacity 0.3s";
                wrapper.style.opacity = "0";
                setTimeout(() => {
                    wrapper.style.display = "none";
                    wrapper.style.opacity = "1";
                    wrapper.style.transition = "";
                    resolve();
                }, 300);
            }
        }

        requestAnimationFrame(animate);
    });
}

// ============================================================
// 15. LINE Flex Message
// ============================================================
async function sendSelfMessage(record) {
    try {
        if (typeof liff === "undefined" || !liff.isInClient()) {
            console.log("目前不在 LINE App，略過自動訊息");
            return;
        }

        let headerColor = "#3498db";
        if (record.status === "下班") {
            headerColor = "#2ecc71";
        }
        if (record.networkStatus !== "公司網路") {
            headerColor = "#e67e22";
        }

        const reasonText = record.networkStatus !== "公司網路" ? "異常原因：非公司網路" : "";

        await liff.sendMessages([
            {
                type: "flex",
                altText: `【打卡通知】${record.status}成功`,
                contents: {
                    type: "bubble",
                    header: {
                        type: "box",
                        layout: "vertical",
                        contents: [
                            {
                                type: "text",
                                text: `${String(record.userName)} 已打卡`,
                                weight: "bold",
                                size: "lg",
                                color: "#ffffff"
                            }
                        ],
                        backgroundColor: headerColor,
                        paddingAll: "12px"
                    },
                    body: {
                        type: "box",
                        layout: "vertical",
                        spacing: "md",
                        contents: [
                            {
                                type: "text",
                                text: `狀態：${String(record.status)}`,
                                size: "md"
                            },
                            {
                                type: "text",
                                text: `時間：${String(record.date)} ${String(record.time)}`,
                                size: "md"
                            },
                            {
                                type: "text",
                                text: `網路：${String(record.networkStatus)}`,
                                size: "md"
                            },
                            ...(reasonText ? [
                                {
                                    type: "text",
                                    text: reasonText,
                                    size: "md",
                                    color: "#e67e22"
                                }
                            ] : [])
                        ]
                    }
                }
            }
        ]);

        console.log("LINE 訊息傳送成功");
    } catch (err) {
        console.warn("LINE 訊息發送失敗:", err);
    }
}

// ============================================================
// 16. 顯示打卡成功
// ============================================================
function showClockSuccess(apiData, isCompany, isMakeup) {
    if (isCompany) {
        Swal.fire({
            icon: "success",
            title: isMakeup ? "🎉 補打卡成功！" : "🎉 打卡成功！",
            html: `
                <div style="font-size:16px;margin-top:8px;">
                    <strong>打卡時間：</strong>
                    <br>
                    <span style="color:#2980b9;font-size:18px;font-weight:bold;">
                        ${apiData.date} ${apiData.time}
                    </span>
                </div>
            `,
            showConfirmButton: false,
            timer: 1800,
            backdrop: "rgba(0,0,0,0.5)",
            customClass: {
                popup: "custom-swal-popup"
            }
        });
    } else {
        Swal.fire({
            icon: "warning",
            title: "⚠ 非公司網路",
            html: `
                <div style="font-size:16px;color:#3498db;font-weight:bold;margin-top:8px;">
                    ◎ 異地打卡成功 ◎
                </div>
                <br>
                <small>打卡時間：${apiData.date} ${apiData.time}</small>
            `,
            showConfirmButton: false,
            timer: 2200,
            backdrop: "rgba(0,0,0,0.5)",
            customClass: {
                popup: "custom-swal-popup"
            }
        });
    }
}

// ============================================================
// 17. 打卡失敗
// ============================================================
function showClockError(message) {
    Swal.fire({
        icon: "error",
        title: "打卡失敗",
        text: message || "請檢查網路連線或重新整理頁面試試看！",
        confirmButtonText: "確定",
        customClass: {
            popup: "custom-swal-popup"
        }
    });
}

// ============================================================
// 18. 設定打卡按鈕狀態
// ============================================================
function setClockButtonsDisabled(disabled) {
    if (btnStart) {
        btnStart.disabled = disabled;
    }
    if (btnEnd) {
        btnEnd.disabled = disabled;
    }
}

// ============================================================
// 19. 核心打卡函式
// ============================================================
async function performClockIn(
    status,
    customDate = "",
    customTime = "",
    isMakeup = false
) {
    if (!window.userReady) {
        Swal.fire({
            icon: "info",
            title: "請稍候",
            html: "使用者資料尚未載入",
            timer: 1200,
            showConfirmButton: false,
            customClass: {
                popup: "custom-swal-popup"
            }
        });
        return;
    }

    if (window.isClocking) {
        return;
    }

    window.isClocking = true;
    setClockButtonsDisabled(true);

    let ip = window.currentIP || sessionStorage.getItem("myIP") || "";
    if (!ip) {
        ip = await getIP();
    }

    updateNetworkStatus(ip);

    startClockAnimation(status, isMakeup);

    const postData = {
        userId: window.userId,
        displayName: window.userName,
        status: status,
        ip: ip,
        customDate: customDate,
        customTime: customTime,
        isMakeup: isMakeup
    };

    let apiData;

    try {
        const response = await fetch(API_ENDPOINT, {
            method: "POST",
            body: JSON.stringify(postData)
        });

        if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
        }

        apiData = await response.json();
    } catch (err) {
        console.error("打卡 API 錯誤:", err);
        window.isClocking = false;
        setClockButtonsDisabled(false);
        showClockError("網路連線失敗，請確認網路後再試一次。");
        return;
    }

    if (!apiData || apiData.success !== true) {
        console.error("打卡失敗:", apiData);
        window.isClocking = false;
        setClockButtonsDisabled(false);
        showClockError(apiData?.message || "打卡失敗，請稍後再試。");
        return;
    }

    const isCompany = COMPANY_IPS.includes(ip);
    const networkStatus = isCompany ? "公司網路" : "非公司網路";

    showClockSuccess(apiData, isCompany, isMakeup);

    addRecordImmediately({
        userId: window.userId,
        userName: window.userName,
        status: status,
        date: apiData.date,
        time: apiData.time,
        ip: ip,
        isMakeup: isMakeup
    });

    updateTodayRecords().catch(err =>
        console.warn("背景更新紀錄失敗:", err)
    );

    sendSelfMessage({
        userName: window.userName,
        status: status,
        date: apiData.date,
        time: apiData.time,
        networkStatus: networkStatus
    }).catch(err =>
        console.warn("背景 LINE 發送失敗:", err)
    );

    window.isClocking = false;
    setClockButtonsDisabled(false);
}

// ============================================================
// 20. 按鈕事件
// ============================================================
if (btnStart) {
    btnStart.onclick = () => {
        performClockIn("上班");
    };
}

if (btnEnd) {
    btnEnd.onclick = () => {
        performClockIn("下班");
    };
}

// 21. 主管補打卡審批
// ============================================================

    };
}

    updateTodayRecords().catch(err =>
        console.warn("初始化今日紀錄失敗:", err)
    );
});
</script>
