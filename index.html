    <div class="app-header">

        </svg>

        </div>

    <div class="section-container">

        <div
            class="section-title"

<script>

// ======================================================
// 設定
// ======================================================

const API_ENDPOINT =
    "https://script.google.com/macros/s/AKfycbxqTIqCeXexv6WqS4I-xaCjxI2_YxtyJCZAUFBliWUBGkqeD0MF_OEiIr74_8YY_MIP/exec";


const COMPANY_IPS = [
    "220.132.124.179",
    "125.228.248.110",
    "114.34.128.159",
    "220.134.230.241",
    "27.240.177.116",
    "114.32.2.171",
    "114.34.203.176"
];


const MANAGERS = [
    "U76174e2a9654ab2c7b1f037b28cb6c86",
    "U7fdf4fbd467b9a93a23fac01ed03351b"
];


// ======================================================
// DOM
// ======================================================

const userInfo =
    document.getElementById("userInfo");

const userAvatar =
    document.getElementById("userAvatar");

const statusInfo =
    document.getElementById("statusInfo");

const headerDate =
    document.getElementById("headerDate");

const btnStart =
    document.getElementById("btnStart");

const btnEnd =
    document.getElementById("btnEnd");

const todayRecords =
    document.getElementById("todayRecords");


// ======================================================
// 全域狀態
// ======================================================

window.userReady = false;

window.clockProcessing = false;

window.userId = "";

window.userName = "";


// ======================================================
// 日期時間
// ======================================================

function updateDateTime() {

    const now = new Date();

    document.getElementById("timeHour").textContent =
        String(now.getHours()).padStart(2, "0");

    document.getElementById("timeMin").textContent =
        String(now.getMinutes()).padStart(2, "0");

    document.getElementById("timeSec").textContent =
        String(now.getSeconds()).padStart(2, "0");


    const dateStr =
        now.toLocaleDateString(
            "zh-TW",
            {
                year: "numeric",
                month: "2-digit",
                day: "2-digit"
            }
        );


    const weekdayStr =
        now.toLocaleDateString(
            "zh-TW",
            {
                weekday: "long"
            }
        );


    headerDate.textContent =
        `${dateStr} (${weekdayStr})`;
}


setInterval(updateDateTime, 1000);

updateDateTime();


// ======================================================
// 今日日期
// ======================================================

function getTodayString() {

    const now = new Date();

    return now
        .toLocaleDateString(
            "zh-TW",
            {
                year: "numeric",
                month: "2-digit",
                day: "2-digit"
            }
        )
        .replace(/\//g, "/");
}


// ======================================================
// 取得 IP
// ======================================================

async function getIP() {

    const cache =
        sessionStorage.getItem("myIP");

    if (cache) {
        return cache;
    }


    try {

        const res =
            await fetch(
                "https://api.ipify.org?format=json"
            );


        const data =
            await res.json();


        sessionStorage.setItem(
            "myIP",
            data.ip
        );


        return data.ip;

    } catch (err) {

        console.error(
            "取得 IP 失敗:",
            err
        );

        return "";
    }
}


// ======================================================
// 時間格式
// ======================================================

function fixTimeFormat(t) {

    if (
        typeof t === "string" &&
        t.includes(":") &&
        !t.includes("T")
    ) {
        return t;
    }


    if (
        typeof t === "string" &&
        t.includes("T")
    ) {

        return new Date(t)
            .toLocaleTimeString(
                "zh-TW",
                {
                    hour12: false
                }
            );
    }


    if (!isNaN(t)) {

        const d =
            new Date(
                (t - 25569) *
                86400 *
                1000
            );


        return d.toLocaleTimeString(
            "zh-TW",
            {
                hour12: false
            }
        );
    }


    return t;
}


// ======================================================
// 使用者初始化
// ======================================================

async function updateUserInfo() {

    try {

        // ----------------------------------------------
        // LIFF + IP 同時執行
        // ----------------------------------------------

        const [
            _,
            ip
        ] = await Promise.all([

            liff.init({
                liffId: "2008555754-M5oJ3AmD"
            }),

            getIP()

        ]);


        // ----------------------------------------------
        // 未登入
        // ----------------------------------------------

        if (!liff.isLoggedIn()) {

            await liff.login();

            return;
        }


        // ----------------------------------------------
        // Profile + IP
        // ----------------------------------------------

        const [
            profile,
            finalIP
        ] = await Promise.all([

            liff.getProfile(),

            getIP()

        ]);


        window.userId =
            profile.userId;

        window.userName =
            profile.displayName;


        userInfo.textContent =
            `${window.userName} 您好`;


        // ----------------------------------------------
        // 頭像
        // ----------------------------------------------

        if (profile.pictureUrl) {

            userAvatar.innerHTML = `
                <img
                    src="${profile.pictureUrl}"
                    alt="avatar"
                    style="
                        width:100%;
                        height:100%;
                        border-radius:50%;
                        object-fit:cover;
                    "
                >
            `;

        } else if (window.userName) {

            userAvatar.textContent =
                window.userName.charAt(0);
        }


        // ----------------------------------------------
        // 主管按鈕
        // ----------------------------------------------

        document
            .getElementById("btnApprove")
            .style.display =
                MANAGERS.includes(window.userId)
                    ? "block"
                    : "none";


        // ----------------------------------------------
        // 公司 IP
        // ----------------------------------------------

        const isCompany =
            COMPANY_IPS.includes(finalIP);


        statusInfo.textContent =
            isCompany
                ? "公司網路"
                : "非公司網路";


        statusInfo.style.background =
            isCompany
                ? "#2ecc71"
                : "#e74c3c";


        // =================================================
        // ★ 最重要
        // 使用者資料完成後立即開放打卡
        //
        // 不等待今日紀錄
        // =================================================

        btnStart.disabled = false;
        btnEnd.disabled = false;

        window.userReady = true;


        console.log(
            "使用者資料完成，打卡功能已啟用"
        );


    } catch (err) {

        console.error(
            "使用者初始化失敗:",
            err
        );


        Swal.fire({

            icon: "error",

            title: "初始化失敗",

            text: "請重新整理頁面後再試一次",

            confirmButtonText: "確定",

            customClass: {
                popup: "custom-swal-popup"
            }

        });

    }
}


// ======================================================
// 取得今日紀錄
//
// ★ 此函式現在完全不阻塞打卡
// ======================================================

async function updateTodayRecords() {

    if (!window.userId) {
        return;
    }


    const today =
        getTodayString();


    try {

        const res =
            await fetch(
                `${API_ENDPOINT}?action=getToday&userId=${encodeURIComponent(window.userId)}&date=${encodeURIComponent(today)}`,
                {
                    method: "GET",
                    cache: "no-store"
                }
            );


        if (!res.ok) {

            throw new Error(
                `HTTP ${res.status}`
            );
        }


        const data =
            await res.json();


        if (!data || !data.length) {

            todayRecords.innerHTML = `
                <div class="records-empty">
                    今日尚無打卡紀錄
                </div>
            `;

            return;
        }


        const recordsHTML =
            data.map(r => {

                const color =
                    r.status === "下班"
                        ? "#2ecc71"
                        : "#3498db";


                const time =
                    fixTimeFormat(r.time);


                const networkLabel =
                    COMPANY_IPS.includes(r.ip)
                        ? "公司網路"
                        : "異地打卡";


                const networkColor =
                    COMPANY_IPS.includes(r.ip)
                        ? "#7f8c8d"
                        : "#e67e22";


                const makeupBadge =
                    r.isMakeup
                        ? `<span class="badge-makeup">待審核</span>`
                        : "";


                return `

                    <div
                        class="record-item"
                        style="border-left-color:${color};"
                    >

                        <div class="record-info">

                            <div class="record-status">

                                ${r.status}

                                ${makeupBadge}

                            </div>

                            <div
                                class="record-details"
                                style="color:${networkColor};"
                            >

                                ${networkLabel}

                            </div>

                        </div>


                        <div
                            class="record-time"
                            style="color:${color};"
                        >

                            ${time}

                        </div>

                    </div>

                `;

            }).join("");


        todayRecords.innerHTML =
            recordsHTML;


    } catch (err) {

        console.error(
            "今日紀錄讀取失敗:",
            err
        );


        todayRecords.innerHTML = `

            <div
                class="records-empty"
                style="color:#e67e22;"
            >
                今日紀錄暫時無法載入
            </div>

        `;
    }
}


// ======================================================
// 手動刷新今日紀錄
// ======================================================

function refreshTodayRecords() {

    const container =
        document.querySelector(
            ".section-container"
        );


    container.classList.add(
        "bounce"
    );


    setTimeout(() => {

        container.classList.remove(
            "bounce"
        );

    }, 400);


    // ★ 不等待
    updateTodayRecords();
}


// ======================================================
// LINE Flex Message
// ======================================================

async function sendSelfMessage(record) {

    if (!liff.isInClient()) {

        console.warn(
            "目前不在 LINE App 內，無法自動發送聊天訊息"
        );

        return;
    }


    let headerColor =
        "#3498db";


    if (record.status === "下班") {

        headerColor =
            "#2ecc71";
    }


    if (record.networkStatus !== "公司網路") {

        headerColor =
            "#e67e22";
    }


    const reasonText =
        record.networkStatus !== "公司網路"
            ? "異常原因：非公司網路"
            : "";


    try {

        const response =
            await liff.sendMessages([

                {

                    type: "flex",

                    altText:
                        `【打卡通知】${record.status}成功`,

                    contents: {

                        type: "bubble",

                        header: {

                            type: "box",

                            layout: "vertical",

                            contents: [

                                {

                                    type: "text",

                                    text:
                                        `${String(record.userName)} 已打卡`,

                                    weight: "bold",

                                    size: "lg",

                                    color: "#ffffff"

                                }

                            ],

                            backgroundColor:
                                headerColor,

                            paddingAll:
                                "12px"
                        },


                        body: {

                            type: "box",

                            layout: "vertical",

                            spacing: "md",

                            contents: [

                                {

                                    type: "text",

                                    text:
                                        `狀態：${String(record.status)}`,

                                    size: "md"

                                },

                                {

                                    type: "text",

                                    text:
                                        `時間：${String(record.date)} ${String(record.time)}`,

                                    size: "md"

                                },

                                {

                                    type: "text",

                                    text:
                                        `網路：${String(record.networkStatus)}`,

                                    size: "md"

                                },

                                ...(reasonText

                                    ? [

                                        {

                                            type: "text",

                                            text:
                                                reasonText,

                                            size: "md",

                                            color:
                                                "#e67e22"

                                        }

                                    ]

                                    : [])

                            ]
                        }
                    }
                }

            ]);


        console.log(
            "LIFF 訊息傳送成功:",
            response
        );


    } catch (err) {

        console.error(
            "LIFF 訊息傳送失敗:",
            err.code,
            err.message,
            err
        );
    }
}


// ======================================================
// 倒數動畫
//
// ★ 動畫只負責動畫
// ★ 不負責決定 API 是否完成
// ======================================================

function startCountdownAnimation(
    status,
    isMakeup
) {

    return new Promise(resolve => {

        const wrapper =
            document.getElementById(
                "countdownWrapper"
            );


        const circle =
            document.getElementById(
                "circleProgress"
            );


        const text =
            document.getElementById(
                "countdownText"
            );


        if (!wrapper || !circle || !text) {

            resolve();

            return;
        }


        wrapper.style.display =
            "flex";

        wrapper.style.opacity =
            "1";

        wrapper.style.transition =
            "none";


        text.textContent =
            isMakeup
                ? "補打卡中..."
                : "打卡中...";


        const colors = {

            上班: {

                start: {
                    r: 52,
                    g: 152,
                    b: 219
                },

                end: {
                    r: 41,
                    g: 128,
                    b: 185
                }

            },


            下班: {

                start: {
                    r: 46,
                    g: 204,
                    b: 113
                },

                end: {
                    r: 39,
                    g: 174,
                    b: 96
                }

            },


            補打卡: {

                start: {
                    r: 243,
                    g: 156,
                    b: 18
                },

                end: {
                    r: 243,
                    g: 156,
                    b: 18
                }

            }

        };


        const {
            start: startColor,
            end: endColor
        } =
            isMakeup
                ? colors.補打卡
                : (
                    colors[status] ||
                    colors.上班
                );


        const radius =
            50;


        const circumference =
            2 * Math.PI * radius;


        circle.style.strokeDasharray =
            circumference;


        circle.style.strokeDashoffset =
            circumference;


        circle.style.stroke =
            `rgb(
                ${startColor.r},
                ${startColor.g},
                ${startColor.b}
            )`;


        let progress =
            0;


        function animate() {

            progress =
                Math.min(
                    progress + 0.015,
                    1
                );


            circle.style.strokeDashoffset =
                circumference *
                (1 - progress);


            const rC =
                Math.round(
                    startColor.r *
                    (1 - progress) +
                    endColor.r *
                    progress
                );


            const gC =
                Math.round(
                    startColor.g *
                    (1 - progress) +
                    endColor.g *
                    progress
                );


            const bC =
                Math.round(
                    startColor.b *
                    (1 - progress) +
                    endColor.b *
                    progress
                );


            circle.style.stroke =
                `rgb(${rC},${gC},${bC})`;


            if (progress < 1) {

                requestAnimationFrame(
                    animate
                );

            } else {

                // 動畫跑完
                // 不在這裡關閉遮罩
                resolve();

            }
        }


        requestAnimationFrame(
            animate
        );

    });
}


// ======================================================
// 關閉倒數
// ======================================================

function hideCountdown() {

    const wrapper =
        document.getElementById(
            "countdownWrapper"
        );


    if (!wrapper) {
        return;
    }


    wrapper.style.transition =
        "opacity 0.25s";


    wrapper.style.opacity =
        "0";


    setTimeout(() => {

        wrapper.style.display =
            "none";

        wrapper.style.opacity =
            "1";

    }, 250);
}


// ======================================================
// 打卡
// ======================================================

async function performClockIn(
    status,
    customDate = "",
    customTime = "",
    isMakeup = false
) {

    // --------------------------------------------------
    // 使用者資料還沒準備好
    // --------------------------------------------------

    if (!window.userReady) {

        Swal.fire({

            icon: "info",

            title: "請稍候",

            html:
                "使用者資料尚未載入",

            timer: 1500,

            showConfirmButton: false,

            customClass: {
                popup: "custom-swal-popup"
            }

        });

        return;
    }


    // --------------------------------------------------
    // 防止重複打卡
    // --------------------------------------------------

    if (window.clockProcessing) {

        return;
    }


    window.clockProcessing =
        true;


    btnStart.disabled =
        true;

    btnEnd.disabled =
        true;


    try {

        // =================================================
        // IP
        //
        // 使用快取，通常不會再等待網路
        // =================================================

        const ip =
            await getIP();


        // =================================================
        // 啟動動畫
        // =================================================

        const animationPromise =
            startCountdownAnimation(
                status,
                isMakeup
            );


        // =================================================
        // ★ 打卡 API
        //
        // 與動畫並行
        // =================================================

        let apiData =
            null;


        try {

            const res =
                await fetch(
                    API_ENDPOINT,
                    {

                        method: "POST",

                        body: JSON.stringify({

                            userId:
                                window.userId,

                            displayName:
                                window.userName,

                            status,

                            ip,

                            customDate,

                            customTime,

                            isMakeup

                        })

                    }
                );


            if (!res.ok) {

                throw new Error(
                    `HTTP ${res.status}`
                );
            }


            apiData =
                await res.json();


            console.log(
                "打卡 API 回應:",
                apiData
            );


        } catch (err) {

            console.error(
                "打卡 API 錯誤:",
                err
            );


            apiData = {

                success: false,

                message:
                    "打卡伺服器連線失敗，請稍後再試。"

            };
        }


        // =================================================
        // 等動畫至少跑完
        //
        // 如果 API 比動畫快，就等動畫。
        // 如果 API 比動畫慢，則等待 API。
        // =================================================

        await animationPromise;


        // =================================================
        // 關閉動畫
        // =================================================

        hideCountdown();


        // =================================================
        // 判斷成功
        // =================================================

        const isSuccess =
            apiData &&
            (
                apiData.success === true ||

                (
                    apiData.message &&
                    String(apiData.message)
                        .includes("成功")
                )
            );


        // =================================================
        // 成功
        // =================================================

        if (isSuccess) {

            const isCompany =
                COMPANY_IPS.includes(ip);


            const networkStatusStr =
                isCompany
                    ? "公司網路"
                    : "非公司網路";


            // ------------------------------------------------
            // Flex Message
            //
            // ★ 背景發送
            // ★ 完全不阻塞成功提示
            // ------------------------------------------------

            sendSelfMessage({

                userName:
                    window.userName,

                status,

                date:
                    apiData.date,

                time:
                    apiData.time,

                networkStatus:
                    networkStatusStr

            }).catch(err => {

                console.error(
                    "背景發送訊息失敗:",
                    err
                );

            });


            // ------------------------------------------------
            // 公司網路
            // ------------------------------------------------

            if (isCompany) {

                await Swal.fire({

                    icon: "success",

                    title:
                        isMakeup
                            ? "🎉 補打卡成功！"
                            : "🎉 打卡成功！",

                    html: `

                        <div
                            style="
                                font-size:16px;
                                margin-top:8px;
                            "
                        >

                            <strong>
                                打卡時間：
                            </strong>

                            <br>

                            <span
                                style="
                                    color:#2980b9;
                                    font-size:18px;
                                    font-weight:bold;
                                "
                            >

                                ${apiData.date}
                                ${apiData.time}

                            </span>

                        </div>

                    `,

                    showConfirmButton:
                        false,

                    timer:
                        2000,

                    backdrop:
                        "rgba(0,0,0,0.5)",

                    customClass: {
                        popup:
                            "custom-swal-popup"
                    }

                });


            // ------------------------------------------------
            // 非公司網路
            // ------------------------------------------------

            } else {

                await Swal.fire({

                    icon:
                        "warning",

                    title:
                        "⚠ 非公司網路",

                    html: `

                        <div
                            style="
                                font-size:16px;
                                color:#3498db;
                                font-weight:bold;
                                margin-top:8px;
                            "
                        >

                            ◎ 異地打卡成功 ◎

                        </div>

                        <br>

                        <small>

                            打卡時間：
                            ${apiData.date}
                            ${apiData.time}

                        </small>

                    `,

                    showConfirmButton:
                        false,

                    timer:
                        2500,

                    backdrop:
                        "rgba(0,0,0,0.5)",

                    customClass: {
                        popup:
                            "custom-swal-popup"
                    }

                });

            }


            // =================================================
            // ★ 打卡成功後
            // ★ 背景更新今日紀錄
            // =================================================

            updateTodayRecords();


        } else {

            // =================================================
            // 打卡失敗
            // =================================================

            Swal.fire({

                icon:
                    "error",

                title:
                    "打卡失敗",

                text:
                    apiData?.message ||
                    "請檢查網路連線或重新整理頁面試試看！",

                confirmButtonText:
                    "確定",

                customClass: {
                    popup:
                        "custom-swal-popup"
                }

            });

        }


    } catch (err) {

        // =================================================
        // 最後防線
        //
        // 避免任何未預期錯誤導致「沒有任何回應」
        // =================================================

        console.error(
            "performClockIn 未預期錯誤:",
            err
        );


        hideCountdown();


        Swal.fire({

            icon:
                "error",

            title:
                "系統發生錯誤",

            text:
                "打卡流程發生異常，請重新整理後再試一次。",

            confirmButtonText:
                "確定",

            customClass: {
                popup:
                    "custom-swal-popup"
            }

        });

    } finally {

        // =================================================
        // ★ 無論成功或失敗
        // ★ 都恢復按鈕
        // =================================================

        window.clockProcessing =
            false;


        btnStart.disabled =
            false;

        btnEnd.disabled =
            false;

    }
}
