<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>奇可智能打卡系統</title>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>
body { 
    font-family: Arial; 
    background:#f7f7f7;
    display:flex; 
    justify-content:center; 
    padding:25px; 
    margin:0;
}

/* === 卡片容器（整個頁面） === */
.card {
    background:white;
    width:95%;
    max-width:480px;
    box-shadow:0 8px 25px rgba(0,0,0,0.12);
    border-radius:18px;
    padding:25px 20px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:20px;
}

/* 日期 / 使用者 / 狀態 */
#dateTime { font-size:22px; }
#userInfo { font-size:26px; font-weight:bold; }
#statusInfo { 
    font-size:20px;
    padding:6px 18px; 
    border-radius:30px; 
    display:inline-block;
    font-weight:bold;
}

/* 按鈕區 */
.buttons-container {
    width:100%;
    display:flex;
    gap:12px;
}

button { 
    flex:1;
    padding:12px 0; 
    font-size:20px; 
    border-radius:10px; 
    cursor:pointer; 
    font-weight:bold; 
    border:none;
    transition:0.22s;
}

/* 按鈕特效 */
button:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 14px rgba(0,0,0,0.12);
}

/* 按鈕顏色：上班橘紅、下班藍 */
#btnStart { background: linear-gradient(145deg, #ff9f43, #ee5253); color: white; }
#btnEnd { background: linear-gradient(145deg, #3498db, #2980b9); color: white; }

/* 倒數動畫 */
#countdownWrapper { 
    width:130px; 
    height:130px; 
    position:relative; 
    display:none; 
}
#circleProgress { 
    fill:none; 
    stroke-width:12; 
    stroke-linecap:round; 
    transform: rotate(-90deg);
    transform-origin: center;
    /* 移除原本在 JS 內動態複寫的變色，改由 SVG id 漸層控制 */
}
#countdownText { 
    position:absolute; 
    top:50%; 
    left:50%; 
    transform:translate(-50%,-50%); 
    font-weight:bold; 
    font-size:18px;
}

/* 打卡紀錄卡片 */
#todayRecords {
    width:100%;
    background:#fafafa;
    border-radius:12px;
    padding:15px;
    border:1px solid #ddd;
    font-size:18px;
}

/* 主管按鈕 */
#btnApprove {
    margin-top:10px;
    padding:14px 20px;
    font-size:20px;
    border-radius:12px;
    background:linear-gradient(145deg,#8e44ad,#663399);
    color:white;
    width:100%;
    border:none;
    cursor:pointer;
    font-weight:bold;
    display:none;
}
#btnApprove:hover {
    transform: translateY(-3px);
    box-shadow:0 8px 14px rgba(0,0,0,0.12);
}

/* 響應式 */
@media(max-width:420px){
    button { font-size:18px; }
    #userInfo { font-size:22px; }
    #todayRecords { font-size:16px; }
}

/* 點擊跳動動畫 */
@keyframes bounce {
    0%   { transform: scale(1); }
    30%  { transform: scale(1.1); }
    50%  { transform: scale(0.95); }
    70%  { transform: scale(1.05); }
    100% { transform: scale(1); }
}
.bounce {
    animation: bounce 0.4s ease;
}
</style>
</head>

<body>

<div class="card">
    <div id="userInfo">正在獲取使用者資訊...</div>
    <div id="statusInfo"></div>
    <div id="dateTime">載入中…</div>

    <div class="buttons-container">
        <button id="btnStart">上班</button>
        <button id="btnEnd">下班</button>
    </div>

    <div id="countdownWrapper">
        <svg width="130" height="130">
            <!-- 定義與按鈕完全相同的漸層色 -->
            <defs>
                <linearGradient id="gradStart" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#ff9f43; stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#ee5253; stop-opacity:1" />
                </linearGradient>
                <linearGradient id="gradEnd" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#3498db; stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#2980b9; stop-opacity:1" />
                </linearGradient>
                <linearGradient id="gradMakeup" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#8e44ad; stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#663399; stop-opacity:1" />
                </linearGradient>
            </defs>
            <circle id="circleProgress" cx="65" cy="65" r="55"></circle>
        </svg>
        <div id="countdownText">打卡中...</div>
    </div>

    <div id="todayRecords" onclick="refreshTodayRecords()" style="cursor:pointer">
        今日打卡紀錄：點擊可刷新
    </div>

    <button id="btnApprove">補打卡審批</button>
</div>

<script>
// ===== 設定 =====
const API_ENDPOINT = "https://script.google.com/macros/s/AKfycbw9grUDCa7Knd7dp4DnaPQaXuybqNBpIswdsuCh25fkUOvrpxVDm-jp0bu8SJyOYthCew/exec";
const COMPANY_IPS  = ["60.248.152.159"];
// ===== 主管 USER_ID =====
const MANAGERS = [
    "U76174e2a9654ab2c7b1f037b28cb6c86", "U7fdf4fbd467b9a93a23fac01ed03351b"
];

// ====== 更新日期時間 ======
function updateDateTime() {
    const now = new Date();
    document.getElementById("dateTime").textContent = now.toLocaleString("zh-TW", { hour12: false });
}
setInterval(updateDateTime, 1000);
updateDateTime();

// ====== 更快的 IP 取得 ======
async function getIP() {
    const cache = sessionStorage.getItem("myIP");
    if (cache) return cache;

    try {
        const res = await fetch("https://api.ipify.org?format=json");
        const data = await res.json();
        sessionStorage.setItem("myIP", data.ip);
        return data.ip;
    } catch {
        return "";
    }
}

// ====== 時間格式處理 ======
function fixTimeFormat(t) {
    if (typeof t === "string" && t.includes(":") && !t.includes("T")) return t;
    if (typeof t === "string" && t.includes("T")) return new Date(t).toLocaleTimeString("zh-TW", { hour12: false });
    if (!isNaN(t)) {
        const d = new Date((t - 25569) * 86400 * 1000);
        return d.toLocaleTimeString("zh-TW", { hour12: false });
    }
    return t;
}

// ====== 按鈕 ======
const btnStart = document.getElementById("btnStart");
const btnEnd   = document.getElementById("btnEnd");

btnStart.disabled = true;
btnEnd.disabled = true;
window.userReady = false;

// ====== 主要：極速取得使用者資訊 + IP ======
async function updateUserInfo() {
    const liffInit = liff.init({ liffId: "2009435359-2rSzV0kR" });

    const [_, ip] = await Promise.all([
        liffInit,
        getIP()
    ]);

    if (!liff.isLoggedIn()) {
        await liff.login();
    }

    const [profile, finalIP] = await Promise.all([
        liff.getProfile(),
        getIP()
    ]);

    window.userId = profile.userId;
    window.userName = profile.displayName;

    document.getElementById("userInfo").textContent = `${window.userName} 您好`;

    document.getElementById("btnApprove").style.display = MANAGERS.includes(window.userId) ? "block" : "none";

    const s = document.getElementById("statusInfo");
    const isCompany = COMPANY_IPS.includes(finalIP);

    s.textContent = isCompany ? "公司網路" : "非公司網路";
    s.style.color = isCompany ? "#008000" : "#FF0000";
    s.style.backgroundColor = isCompany ? "rgba(144,238,144,0.6)" : "rgba(255,182,193,0.3)";
    s.style.padding = "5px 15px";
    s.style.borderRadius = "20px";
    s.style.display = "inline-block";
    s.style.fontWeight = "bold";

    btnStart.disabled = false;
    btnEnd.disabled = false;
    window.userReady = true;
}

document.addEventListener("DOMContentLoaded", updateUserInfo);

/* ===== 打卡後發送 Flex Message 給自己 ===== */
async function sendSelfMessage(record) {
    if (!liff.isInClient()) return;

    let headerColor = "#3498db"; // 上班藍
    if (record.status === "下班") headerColor = "#2ecc71"; // 下班綠
    if (record.networkStatus !== "公司網路") headerColor = "#e67e22"; // 異常橘

    let reasonText = record.networkStatus !== "公司網路" ? "異常原因：非公司網路" : "";

    try {
        await liff.sendMessages([{
            type: 'flex',
            altText: '打卡通知',
            contents: {
                type: "bubble",
                header: {
                    type: "box",
                    layout: "vertical",
                    contents: [{
                        type: "text",
                        text: `${record.userName} 已打卡`,
                        weight: "bold",
                        size: "lg",
                        color: "#ffffff"
                    }],
                    backgroundColor: headerColor,
                    paddingAll: "12px"
                },
                body: {
                    type: "box",
                    layout: "vertical",
                    spacing: "md",
                    contents: [
                        { type: "text", text: `狀態：${record.status}`, size: "md" },
                        { type: "text", text: `時間：${record.date} ${record.time}`, size: "md" },
                        { type: "text", text: `網路：${record.networkStatus}`, size: "md" },
                        ...(reasonText ? [{ type: "text", text: reasonText, size: "md", color: "#e67e22" }] : [])
                    ]
                }
            }
        }]);
        
        await new Promise(r => setTimeout(r, 800));
        console.log("訊息已成功送出");
    } catch(err) {
        console.error("LIFF 訊息傳送失敗:", err);
    }
}

// ===== 打卡函式 =====
async function performClockIn(status, customDate = "", customTime = "", isMakeup = false) {
    if (!window.userReady) {
        Swal.fire({ icon:"info", title:"請稍候", html:"使用者資料尚未載入", timer:1500, showConfirmButton:false });
        return;
    }

    const ip = await getIP();

    // 顯示專業商務風格載入提示，並鎖定背景防止重複點擊
    Swal.fire({
        html: `
            <div style="padding: 10px 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
                <!-- 專業圓形脈衝載入動畫 -->
                <div class="custom-loader-spinner" style="
                    width: 50px;
                    height: 50px;
                    margin: 0 auto 18px auto;
                    border: 4px solid #f3f3f3;
                    border-top: 4px solid #3498db;
                    border-radius: 50%;
                    animation: spin 0.8s linear infinite;
                "></div>
                <h3 style="margin: 0 0 8px 0; color: #2c3e50; font-size: 20px; font-weight: 600;">系統打卡處理中</h3>
                <p style="margin: 0; color: #7f8c8d; font-size: 14px; letter-spacing: 0.5px;">正在與雲端伺服器安全同步，請稍候...</p>
                <style>
                    @keyframes spin {
                        0% { transform: rotate(0deg); }
                        100% { transform: rotate(360deg); }
                    }
                </style>
            </div>
        `,
        showConfirmButton: false,
        allowOutsideClick: false,
        allowEscapeKey: false,
        backdrop: "rgba(0,0,0,0.5)"
    });

    // ===== 發送打卡 API =====
    let apiData = null;
    try {
        const res = await fetch(API_ENDPOINT, {
            method: "POST",
            body: JSON.stringify({ userId: window.userId, displayName: window.userName, status, ip, customDate, customTime, isMakeup })
        });
        apiData = await res.json();
    } catch(err) {
        console.error(err);
        apiData = { message:"失敗" };
    }

    // ===== 判斷 API 結果並確實等待 LIFF 發送 =====
    if (apiData.message && apiData.message.includes("成功")) {
        const isCompany = COMPANY_IPS.includes(ip);
        const networkStatusStr = isCompany ? "公司網路" : "非公司網路";

        // 強制確保 LINE 核心跑完發送才往下走
        await sendSelfMessage({
            userName: window.userName,
            status: status,
            date: apiData.date,
            time: apiData.time,
            networkStatus: networkStatusStr
        });

        // 根據網路狀態彈出對應提示
        if (isCompany) {
            Swal.fire({
                icon: "success",
                title: isMakeup ? "🎉 補打卡成功！" : "🎉 打卡成功！",
                html: `<strong>打卡時間：</strong> ${apiData.date} ${apiData.time}`,
                showConfirmButton: false,
                timer: 2000,
                backdrop: "rgba(0,0,0,0.5)"
            });
        } else {
            Swal.fire({
                icon: "warning",
                title: `<span style="font-size:20px;color:#e67e22;">⚠ 非公司網路</span>`,
                html: `<div style="font-size:16px;color:#3498db;font-weight:bold;margin-top:8px;">◎ 異地打卡成功 ◎</div><br><small>打卡時間：${apiData.date} ${apiData.time}</small>`,
                showConfirmButton: false,
                timer: 2500,
                backdrop: "rgba(0,0,0,0.5)"
            });
        }
    } else {
        Swal.fire({
            icon: "error",
            title: "打卡失敗",
            text: "請檢查網路連線或重新整理頁面試試看！",
            timer: 2000
        });
    }

    // ===== 更新今日打卡紀錄 =====
    updateTodayRecords();
}

// ===== 取得今日紀錄 =====
async function updateTodayRecords() {
    const now = new Date();
    const today = now.toLocaleDateString("zh-TW").replace(/\//g, "/");

    try {
        const res = await fetch(`${API_ENDPOINT}?action=getToday&userId=${window.userId}&date=${today}`);
        const data = await res.json();

        const container = document.getElementById("todayRecords");
        if (!data.length) {
            container.innerHTML = "今日打卡紀錄：無";
            return;
        }

        container.innerHTML = "今日打卡紀錄：<br>" + data.map(r => {
            const time = fixTimeFormat(r.time);
            const ipLabel = COMPANY_IPS.includes(r.ip) ? "(成功)" : "(失敗-連線錯誤請重新打卡)";
            const makeup = r.isMakeup ? "(補打卡-待審核)" : "";
            return `${r.status} ${time} ${ipLabel} ${makeup}`;
        }).join("<br>");

    } catch(err) {
        console.error(err);
        document.getElementById("todayRecords").innerHTML = "今日打卡紀錄：讀取失敗";
    }
}

function refreshTodayRecords() {
    const container = document.getElementById("todayRecords");
    container.classList.add("bounce");
    setTimeout(() => {
        container.classList.remove("bounce");
    }, 400);
    updateTodayRecords();
}

// ===== 按鈕事件 =====
document.getElementById("btnStart").onclick = () => performClockIn("上班");
document.getElementById("btnEnd").onclick = () => performClockIn("下班");

document.getElementById("btnApprove").onclick = () => {
    window.location.href = "https://script.google.com/macros/s/AKfycbyxXrvVxfgwrI-SdXM03QEYxEpG-xqyjVQcxdNz1IBK3DtFC-kUFjHhRaNtgXNU-Mdu/exec";
};

// ===== 初始化 =====
window.onload = async () => {
    await updateUserInfo();
    await updateTodayRecords();
};
</script>
</body>
</html>
