<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>奇可智能打卡系統</title>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root {
    --bg-color: #f0f4f8;
    --card-bg: #ffffff;
    --text-main: #2c3e50;
    --text-sub: #7f8c8d;
    --start-gradient: linear-gradient(135deg, #ff9f43, #ee5253);
    --end-gradient: linear-gradient(135deg, #3498db, #2980b9);
    --approve-gradient: linear-gradient(145deg, #8e44ad, #663399);
}
body {
    font-family: "Arial", "Noto Sans TC", sans-serif;
    background: var(--bg-color);
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    color: var(--text-main);
}
.app-container {
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    background: var(--bg-color);
    display: flex;
    flex-direction: column;
    box-sizing: border-box;
    padding: 16px 16px 32px 16px;
    gap: 16px;
}
.app-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 4px;
}
.user-profile-container {
    display: flex;
    align-items: center;
    gap: 12px;
}
.user-avatar {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: linear-gradient(135deg, #6c5ce7, #a29bfe);
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 20px;
    font-weight: bold;
    box-shadow: 0 4px 10px rgba(108, 92, 231, 0.3);
    flex-shrink: 0;
    overflow: hidden;
}
.user-profile {
    display: flex;
    flex-direction: column;
    gap: 2px;
}
#userInfo {
    font-size: 20px;
    font-weight: bold;
    color: var(--text-main);
}
.app-subtitle {
    font-size: 14px;
    font-weight: bold;
    color: var(--text-sub);
}
#statusInfo {
    font-size: 14px;
    font-weight: bold;
    color: white;
    padding: 6px 14px;
    border-radius: 20px;
    background: #95a5a6;
    text-align: center;
    white-space: nowrap;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    flex-shrink: 0;
}
.dashboard-card {
    background: var(--card-bg);
    border-radius: 20px;
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    box-shadow: 0 15px 30px rgba(0,0,0,0.15);
}
.clock-container {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: linear-gradient(145deg, #f8fafc, #edf2f7);
    padding: 14px 20px;
    border-radius: 16px;
    box-shadow: inset 0 2px 5px rgba(0,0,0,0.05), 0 4px 12px rgba(0,0,0,0.03);
    border: 1px solid #e2e8f0;
}
.time-box {
    background: #ffffff;
    padding: 8px 12px;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
    border: 1px solid #edf2f7;
}
#timeHour,
#timeMin,
#timeSec {
    font-size: 38px;
    font-weight: normal;
    color: var(--text-main);
    font-family: "Courier New", Courier, monospace;
    letter-spacing: 1px;
}
.time-separator {
    font-size: 32px;
    font-weight: normal;
    color: #a0aec0;
    padding-bottom: 4px;
    animation: pulseSeparator 1.5s infinite;
}
@keyframes pulseSeparator {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
}
.buttons-container {
    display: flex;
    gap: 15px;
    width: 100%;
}
.buttons-container button {
    flex: 1;
    padding: 15px 0;
    font-size: 22px;
    font-weight: bold;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    color: white;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    transition: all 0.2s;
}
#btnStart {
    background: var(--start-gradient);
}
#btnEnd {
    background: var(--end-gradient);
}
button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    box-shadow: none !important;
    transform: none !important;
}
button:not(:disabled):active {
    transform: scale(0.97);
}
.section-container {
    background: var(--card-bg);
    border-radius: 16px;
    padding: 18px;
    box-shadow: 0 10px 20px rgba(0,0,0,0.08);
    border: 1px solid #ddd;
}
.section-title {
    font-size: 16px;
    font-weight: bold;
    color: var(--text-main);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
}
#todayRecords {
    display: flex;
    flex-direction: column;
    gap: 8px;
}
.record-item {
    background: #fafafa;
    border-radius: 10px;
    padding: 12px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-left: 4px solid #3498db;
    box-sizing: border-box;
    font-size: 16px;
}
.record-info {
    display: flex;
    flex-direction: column;
    gap: 2px;
}
.record-status {
    font-size: 16px;
    font-weight: bold;
    color: #2c3e50;
}
.record-details {
    font-size: 12px;
    color: #7f8c8d;
}
.record-time {
    font-size: 18px;
    font-weight: bold;
    color: #2c3e50;
}
.badge-makeup {
    background: #e67e22;
    color: white;
    font-size: 11px;
    padding: 2px 6px;
    border-radius: 6px;
    margin-left: 4px;
    vertical-align: middle;
}
.records-empty {
    text-align: center;
    color: var(--text-sub);
    font-size: 15px;
    padding: 15px 0;
}
#btnApprove {
    padding: 14px 20px;
    font-size: 18px;
    font-weight: bold;
    border-radius: 10px;
    background: var(--approve-gradient);
    color: white;
    display: none;
    width: 100%;
    cursor: pointer;
    border: none;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    transition: all 0.2s;
}
#btnApprove:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 15px rgba(0,0,0,0.15);
}
@keyframes bounce {
    0% { transform: scale(1); }
    30% { transform: scale(1.1); }
    50% { transform: scale(0.95); }
    70% { transform: scale(1.05); }
    100% { transform: scale(1); }
}
.bounce {
    animation: bounce 0.4s ease;
}
.swal2-popup.custom-swal-popup {
    border-radius: 20px !important;
    padding: 24px !important;
    font-family: "Arial", "Noto Sans TC", sans-serif !important;
    box-shadow: 0 20px 40px rgba(0,0,0,0.2) !important;
}
.swal2-title {
    font-size: 22px !important;
    color: #2c3e50 !important;
    font-weight: bold !important;
}
.swal2-html-container {
    font-size: 16px !important;
    color: #555 !important;
}
.swal2-styled.swal2-confirm {
    background: linear-gradient(135deg, #3498db, #2980b9) !important;
    border-radius: 10px !important;
    font-size: 16px !important;
    font-weight: bold !important;
    padding: 10px 24px !important;
    box-shadow: 0 4px 12px rgba(52, 152, 219, 0.3) !important;
}
#countdownWrapper {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(255, 255, 255, 0.85);
    z-index: 9999;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}
#circleProgress {
    fill: none;
    stroke-width: 12;
    stroke-linecap: round;
}
#countdownText {
    margin-top: 15px;
    font-size: 16px;
    font-weight: bold;
    color: #2c3e50;
    white-space: nowrap;
}
</style>
</head>
<body>
<div class="app-container">
    <!-- 頂部資訊列 -->
    <div class="app-header">
        <div class="user-profile-container">
            <div class="user-avatar" id="userAvatar">👤</div>
            <div class="user-profile">
                <div id="userInfo">載入中...</div>
                <div class="app-subtitle" id="headerDate">載入日期中...</div>
            </div>
        </div>
        <div id="statusInfo">檢查中...</div>
    </div>
    <!-- 打卡儀表板 -->
    <div class="dashboard-card">
        <div class="clock-container">
            <div class="time-box">
                <span id="timeHour">00</span>
            </div>
            <span class="time-separator">:</span>
            <div class="time-box">
                <span id="timeMin">00</span>
            </div>
            <span class="time-separator">:</span>
            <div class="time-box">
                <span id="timeSec">00</span>
            </div>
        </div>
        <div class="buttons-container">
            <button id="btnStart" disabled>上班</button>
            <button id="btnEnd" disabled>下班</button>
        </div>
    </div>
    <!-- 倒數動畫 -->
    <div id="countdownWrapper">
        <svg width="120" height="120">
            <circle cx="60" cy="60" r="50" stroke="#eee" stroke-width="12" fill="none"></circle>
            <circle id="circleProgress" cx="60" cy="60" r="50" stroke="#3498db" stroke-width="12" fill="none" transform="rotate(-90 60 60)"></circle>
        </svg>
        <div id="countdownText">打卡中...</div>
    </div>
    <!-- 今日紀錄 -->
    <div class="section-container">
        <div class="section-title" onclick="refreshTodayRecords()">📋 今日打卡紀錄</div>
        <div id="todayRecords" class="records-empty">正在載入紀錄…</div>
    </div>
    <!-- 主管簽核 -->
    <button id="btnApprove">補打卡審批</button>
</div>
<script>
const API_ENDPOINT = "https://script.google.com/macros/s/AKfycbzDOT_uMew8j75QoLGfEVOl99q5ZpYTdvr284KxOScQ8dkUx_z7bzeBcDc-B8wXOY9mSg/exec";
const COMPANY_IPS  = ["60.248.152.159"];

const MANAGERS = [
    "U76174e2a9654ab2c7b1f037b28cb6c86",
    "U7fdf4fbd467b9a93a23fac01ed03351b"
];

// DOM
const userInfo = document.getElementById("userInfo");
const userAvatar = document.getElementById("userAvatar");
const statusInfo = document.getElementById("statusInfo");
const headerDate = document.getElementById("headerDate");
const btnStart = document.getElementById("btnStart");
const btnEnd = document.getElementById("btnEnd");
const todayRecords = document.getElementById("todayRecords");
const btnApprove = document.getElementById("btnApprove");

// 全域狀態
window.userReady = false;
window.clockProcessing = false;
window.userId = "";
window.userName = "";
window.allowRemote = false; // 依需求調整或由後端賦值

// 日期時間
function updateDateTime() {
    const now = new Date();
    document.getElementById("timeHour").textContent = String(now.getHours()).padStart(2, "0");
    document.getElementById("timeMin").textContent = String(now.getMinutes()).padStart(2, "0");
    document.getElementById("timeSec").textContent = String(now.getSeconds()).padStart(2, "0");
    const dateStr = now.toLocaleDateString("zh-TW", { year: "numeric", month: "2-digit", day: "2-digit" });
    const weekdayStr = now.toLocaleDateString("zh-TW", { weekday: "long" });
    headerDate.textContent = `${dateStr} (${weekdayStr})`;
}
setInterval(updateDateTime, 1000);
updateDateTime();

// 取得今日日期
function getTodayString() {
    const now = new Date();
    return now.toLocaleDateString("zh-TW", { year: "numeric", month: "2-digit", day: "2-digit" }).replace(/\//g, "/");
}

// 預先取得/快取 IP
async function preloadIP() {
    const cache = sessionStorage.getItem("myIP");
    if (cache) {
        return cache;
    }
    try {
        const res = await fetch("https://api.ipify.org?format=json");
        if (!res.ok) {
            throw new Error(`IP API HTTP ${res.status}`);
        }
        const data = await res.json();
        if (data && data.ip) {
            sessionStorage.setItem("myIP", data.ip);
            return data.ip;
        }
        return "";
    } catch (err) {
        console.error("取得 IP 失敗:", err);
        return "";
    }
}

// 取得 GPS 定位 (異地打卡用)
async function getGeoLocation() {
    return new Promise((resolve) => {
        if (!navigator.geolocation) {
            resolve({ lat: "", lng: "" });
            return;
        }
        navigator.geolocation.getCurrentPosition(
            (pos) => {
                resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude });
            },
            (err) => {
                console.warn("取得定位失敗:", err);
                resolve({ lat: "", lng: "" });
            },
            { timeout: 5000, enableHighAccuracy: true }
        );
    });
}

// 時間格式修正
function fixTimeFormat(t) {
    if (typeof t === "string" && t.includes(":") && !t.includes("T")) {
        return t;
    }
    if (typeof t === "string" && t.includes("T")) {
        return new Date(t).toLocaleTimeString("zh-TW", { hour12: false });
    }
    if (!isNaN(t)) {
        const d = new Date((t - 25569) * 86400 * 1000);
        return d.toLocaleTimeString("zh-TW", { hour12: false });
    }
    return t || "";
}

// 使用者資訊初始化 (平行載入優化)
async function initUserInfo() {
    try {
        const [_liff, initialIP] = await Promise.all([
            liff.init({ liffId: "2009435359-2rSzV0kR" }),
            preloadIP()
        ]);
        console.log("LIFF 初始化完成", initialIP);
        if (!liff.isLoggedIn()) {
            await liff.login();
            return false;
        }
        const [profile, finalIP] = await Promise.all([
            liff.getProfile(),
            preloadIP()
        ]);
        window.userId = profile.userId;
        window.userName = profile.displayName;
        userInfo.textContent = `${window.userName} 您好`;
        if (profile.pictureUrl) {
            userAvatar.innerHTML = `<img src="${profile.pictureUrl}" alt="avatar" style="width:100%; height:100%; border-radius:50%; object-fit:cover;">`;
        } else if (window.userName) {
            userAvatar.textContent = window.userName.charAt(0);
        }
        if (MANAGERS.includes(window.userId)) {
            btnApprove.style.display = "block";
        } else {
            btnApprove.style.display = "none";
        }
        const isCompany = COMPANY_IPS.includes(finalIP);
        statusInfo.textContent = isCompany ? "公司網路" : "非公司網路";
        statusInfo.style.background = isCompany ? "#2ecc71" : "#e74c3c";
        window.userReady = true;
        btnStart.disabled = false;
        btnEnd.disabled = false;
        console.log("使用者初始化完成，打卡功能已啟用");
        return true;
    } catch (err) {
        console.error("updateUserInfo 錯誤:", err);
        window.userReady = false;
        btnStart.disabled = true;
        btnEnd.disabled = true;
        Swal.fire({
            icon: "error",
            title: "初始化失敗",
            text: "LINE 使用者資料載入失敗，請重新整理頁面後再試一次。",
            confirmButtonText: "確定",
            customClass: { popup: "custom-swal-popup" }
        });
        return false;
    }
}

// ===== 共用紀錄渲染函式 =====
function renderRecords(data) {
    if (!data || !data.length) {
        todayRecords.innerHTML = `<div class="records-empty">今日尚無打卡紀錄</div>`;
        return;
    }

    const recordsHTML = data.map(r => {
        let color = r.status === "下班" ? "#2ecc71" : "#3498db";
        const time = fixTimeFormat(r.time);
        const networkLabel = COMPANY_IPS.includes(r.ip) ? "公司網路" : "異地打卡";
        const networkColor = COMPANY_IPS.includes(r.ip) ? "#7f8c8d" : "#e67e22";
        const makeupBadge = r.isMakeup ? `<span class="badge-makeup">待審核</span>` : "";
        
        return `
            <div class="record-item" style="border-left-color: ${color};">
              <div class="record-info">
                <div class="record-status">${r.status} ${makeupBadge}</div>
                <div class="record-details" style="color: ${networkColor};">${networkLabel}</div>
              </div>
              <div class="record-time" style="color: ${color};">${time}</div>
            </div>
        `;
    }).join("");

    todayRecords.innerHTML = recordsHTML;
}

// ===== 立即在前端畫面插入一筆紀錄（達成秒顯示） =====
function appendOptimisticRecord(newRecord) {
    let cachedRecords = [];
    try {
        const raw = sessionStorage.getItem("cached_today_records");
        if (raw) cachedRecords = JSON.parse(raw);
    } catch (e) {}

    const exists = cachedRecords.some(r => r.status === newRecord.status && r.time === newRecord.time);
    if (!exists) {
        cachedRecords.push(newRecord);
        sessionStorage.setItem("cached_today_records", JSON.stringify(cachedRecords));
        renderRecords(cachedRecords);
    }
}

// ===== 今日紀錄非同步更新函式 ======
async function updateTodayRecords(isFastRender = false){
  if (!window.userId) return;
  
  if (!isFastRender && !sessionStorage.getItem("cached_today_records")) {
      todayRecords.innerHTML = `
        <div class="record-item" style="border-left-color: #bdc3c7; opacity: 0.6;">
          <div class="record-info">
            <div style="background: #e0e0e0; width: 80px; height: 16px; border-radius: 4px; margin-bottom: 6px;"></div>
            <div style="background: #e0e0e0; width: 60px; height: 12px; border-radius: 4px;"></div>
          </div>
          <div style="background: #e0e0e0; width: 50px; height: 20px; border-radius: 4px;"></div>
        </div>
      `;
  }
  
  try {
    const res = await fetch(`${API_ENDPOINT}?action=getToday&userId=${encodeURIComponent(window.userId)}&date=${encodeURIComponent(getTodayString())}`);
    const data = await res.json();

    // 儲存至 sessionStorage 快取
    sessionStorage.setItem("cached_today_records", JSON.stringify(data));
    renderRecords(data);
  } catch (err) {
    console.error(err);
    if (!sessionStorage.getItem("cached_today_records")) {
        todayRecords.innerHTML = `<div class="records-empty" style="color: #e74c3c;">今日打卡紀錄讀取失敗</div>`;
    }
  }
}

// 手動刷新今日紀錄
function refreshTodayRecords() {
    const container = document.querySelector(".section-container");
    if (container) {
        container.classList.add("bounce");
        setTimeout(() => {
            container.classList.remove("bounce");
        }, 400);
    }
    sessionStorage.removeItem("cached_today_records");
    updateTodayRecords();
}

/* ===== 打卡後發送 Flex Message 給自己 (整合版) ===== */
async function sendSelfMessage(record) {
    if (!liff.isInClient()) {
        console.warn("目前不在 LINE App 內，無法自動發送聊天訊息");
        return;
    }
    let headerColor = "#3498db";
    if (record.status === "下班") {
        headerColor = "#2ecc71";
    }
    if (record.networkStatus !== "公司網路") {
        headerColor = "#e67e22";
    }
    const reasonText = record.networkStatus !== "公司網路" ? "異常原因：非公司網路" : "";
    try {
        const response = await liff.sendMessages([{
            type: "flex",
            altText: `【打卡通知】${record.status}成功`,
            contents: {
                type: "bubble",
                header: {
                    type: "box",
                    layout: "vertical",
                    contents: [{
                        type: "text",
                        text: `${String(record.userName)} 已打卡`,
                        weight: "bold",
                        size: "lg",
                        color: "#ffffff"
                    }],
                    backgroundColor: headerColor,
                    paddingAll: "12px"
                },
                body: {
                    type: "box",
                    layout: "vertical",
                    spacing: "md",
                    contents: [
                        { type: "text", text: `狀態：${String(record.status)}`, size: "md" },
                        { type: "text", text: `時間：${String(record.date)} ${String(record.time)}`, size: "md" },
                        { type: "text", text: `網路：${String(record.networkStatus)}`, size: "md" },
                        ...(reasonText ? [{ type: "text", text: reasonText, size: "md", color: "#e67e22" }] : [])
                    ]
                }
            }
        }]);
        console.log("LINE Flex Message 傳送成功:", response);
        await new Promise(r => setTimeout(r, 800));
    } catch (err) {
        console.error("LINE Flex Message 傳送失敗:", err);
    }
}

// 顯示「打卡中」彈窗
function showClockLoading(status, isMakeup) {
    Swal.fire({
        title: isMakeup ? "補打卡中..." : `${status}打卡中...`,
        html: `
            <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; padding-top:8px;">
                <div style="width:52px; height:52px; border:5px solid #e8edf2; border-top:5px solid #3498db; border-radius:50%; animation:clockSpin 0.7s linear infinite;"></div>
                <div style="margin-top:16px; font-size:14px; color:#7f8c8d;">正在確認打卡資料...</div>
            </div>
            <style>
                @keyframes clockSpin {
                    from { transform:rotate(0deg); }
                    to { transform:rotate(360deg); }
                }
            </style>
        `,
        allowOutsideClick: false,
        allowEscapeKey: false,
        showConfirmButton: false,
        backdrop: "rgba(0,0,0,0.45)",
        customClass: { popup: "custom-swal-popup" }
    });
}

// ===== 打卡函式（採用樂觀更新，零延遲秒開） =====
async function performClockIn(status, customDate = "", customTime = "", isMakeup = false) {
    if (!window.userReady && !isMakeup) {
        Swal.fire({ 
            icon: "warning", 
            title: "提示", 
            html: "<span style='color: #e67e22;'>目前為無效打卡區，無法打卡！</span>", 
            timer: 1800, 
            showConfirmButton: false,
            customClass: { popup: 'custom-swal-popup' }
        });
        return;
    }

    const ip = await preloadIP();
    const isCompanyIP = COMPANY_IPS.includes(ip);

    let lat = "", lng = "";
    if (!isCompanyIP) {
        const geo = await getGeoLocation();
        lat = geo.lat;
        lng = geo.lng;
    }

    const nowObj = new Date();
    const fallbackDate = customDate ? customDate.replace(/[-\/]/g, "/") : nowObj.toLocaleDateString("zh-TW", { year: 'numeric', month: '2-digit', day: '2-digit' }).replace(/\//g, "/");
    const fallbackTime = customTime ? customTime : nowObj.toLocaleTimeString("zh-TW", { hour12: false });

    // 1. 顯示「打卡中」彈窗
    showClockLoading(status, isMakeup);
    await new Promise(r => setTimeout(r, 400));

    // 2. 背景發送 API 與處理響應
    let apiData = null;
    try {
        const res = await fetch(API_ENDPOINT, {
            method: "POST",
            body: JSON.stringify({ userId: window.userId, displayName: window.userName, status, ip, lat, lng, customDate, customTime, isMakeup })
        });
        apiData = await res.json();
    } catch(err) {
        console.error(err);
        apiData = { message: "失敗" };
    }

    const successDate = apiData?.date || fallbackDate;
    const successTime = apiData?.time || fallbackTime;
    const networkStatusStr = isCompanyIP ? "公司網路" : "非公司網路";

    if (apiData && apiData.message && apiData.message.includes("失敗")) {
        Swal.fire({
            icon: "error",
            title: "打卡失敗",
            text: apiData.message || "請檢查網路連線或重新整理頁面試試看！",
            confirmButtonText: "確定",
            customClass: { popup: 'custom-swal-popup' }
        });
        return;
    }

    // 3. 樂觀更新：彈出成功視窗
    if (isCompanyIP) {
        Swal.fire({
            icon: "success",
            title: isMakeup ? "🎉 補打卡成功！" : "🎉 打卡成功！",
            html: `<div style="font-size: 16px; margin-top: 8px;"><strong>打卡時間：</strong><br><span style="color: #2980b9; font-size: 18px; font-weight: bold;">${successDate} ${successTime}</span></div>`,
            showConfirmButton: false, 
            timer: 1600, 
            backdrop: "rgba(0,0,0,0.5)",
            customClass: { popup: 'custom-swal-popup' }
        });
    } else {
        Swal.fire({
            icon: "warning",
            title: "⚠ 非公司網路",
            html: `<div style="font-size:16px;color:#3498db;font-weight:bold;margin-top:8px;">◎ 異地打卡成功 ◎</div><br><small>打卡時間：${successDate} ${successTime}</small>`,
            showConfirmButton: false, 
            timer: 2000, 
            backdrop: "rgba(0,0,0,0.5)",
            customClass: { popup: 'custom-swal-popup' }
        });
    }

    // 4. 立即將紀錄插入前端畫面與快取
    appendOptimisticRecord({
        status: status,
        time: successTime,
        ip: ip,
        isMakeup: isMakeup
    });

    // 5. 傳送 LIFF 訊息
    await sendSelfMessage({
        userName: window.userName,
        status: status,
        date: successDate,
        time: successTime,
        networkStatus: networkStatusStr
    });

    // 6. 5秒後靜默校正一次後端最新資料
    setTimeout(() => updateTodayRecords(true), 5000);
}

// 綁定按鈕事件
btnStart.onclick = () => performClockIn("上班");
btnEnd.onclick = () => performClockIn("下班");

btnApprove.onclick = () => {
    window.location.href = "https://script.google.com/macros/s/AKfycbyxXrvVxfgwrI-SdXM03QEYxEpG-xqyjVQcxdNz1IBK3DtFC-kUFjHhRaNtgXNU-Mdu/exec";
};

// 初始化 (平行載入 + 快取優先)
window.onload = async () => {
    console.log("系統開始初始化...");
    
    // 如果有舊快取，先直接渲染畫面達到秒開效果
    try {
        const cached = sessionStorage.getItem("cached_today_records");
        if (cached) {
            renderRecords(JSON.parse(cached));
        }
    } catch (e) {}

    const isLoggedIn = await initUserInfo();
    if (isLoggedIn && window.userId) {
        updateTodayRecords();
    }
    console.log("前台初始化完成");
};
</script>
</body>
