<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>奇可智能打卡系統</title>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root {
    --bg-color: #f0f4f8;
    --card-bg: #ffffff;
    --text-main: #2c3e50;
    --text-sub: #7f8c8d;
    --start-gradient: linear-gradient(135deg, #ff9f43, #ee5253);
    --end-gradient: linear-gradient(135deg, #3498db, #2980b9);
    --approve-gradient: linear-gradient(145deg, #8e44ad, #663399);
}

body {
    font-family: "Arial", "Noto Sans TC", sans-serif;
    background: var(--bg-color);
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    color: var(--text-main);
}

.app-container {
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    background: var(--bg-color);
    display: flex;
    flex-direction: column;
    box-sizing: border-box;
    padding: 16px 16px 32px 16px;
    gap: 16px;
}

.app-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 4px;
}
.user-profile-container {
    display: flex;
    align-items: center;
    gap: 12px;
}

.user-avatar {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: linear-gradient(135deg, #6c5ce7, #a29bfe);
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 20px;
    font-weight: bold;
    box-shadow: 0 4px 10px rgba(108, 92, 231, 0.3);
    flex-shrink: 0;
}

.user-profile {
    display: flex;
    flex-direction: column;
    gap: 2px;
}
#userInfo {
    font-size: 20px;
    font-weight: bold;
    color: var(--text-main);
}
.app-subtitle {
    font-size: 14px;
    font-weight: bold;
    color: var(--text-sub);
}

#statusInfo {
    font-size: 14px; 
    font-weight: bold;
    color: white;
    padding: 6px 14px; 
    border-radius: 20px;
    background: #95a5a6;
    text-align: center;
    white-space: nowrap;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    flex-shrink: 0;
}

.dashboard-card {
    background: var(--card-bg);
    border-radius: 20px;
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    box-shadow: 0 15px 30px rgba(0,0,0,0.15);
}

.clock-container {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: linear-gradient(145deg, #f8fafc, #edf2f7);
    padding: 14px 20px;
    border-radius: 16px;
    box-shadow: inset 0 2px 5px rgba(0,0,0,0.05), 0 4px 12px rgba(0,0,0,0.03);
    border: 1px solid #e2e8f0;
}

.time-box {
    background: #ffffff;
    padding: 8px 12px;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
    border: 1px solid #edf2f7;
}

#timeHour, #timeMin, #timeSec {
    font-size: 38px;       
    font-weight: normal;   
    color: var(--text-main);
    font-family: "Courier New", Courier, monospace;
    letter-spacing: 1px;
}

.time-separator {
    font-size: 32px;
    font-weight: normal;
    color: #a0aec0;
    padding-bottom: 4px;
    animation: pulseSeparator 1.5s infinite;
}

@keyframes pulseSeparator {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
}

.buttons-container {
    display: flex;
    gap: 15px;
    width: 100%;
}
.buttons-container button {
    flex: 1;
    padding: 15px 0;
    font-size: 22px;
    font-weight: bold;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    color: white;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    transition: all 0.2s;
}

#btnStart { background: var(--start-gradient); }
#btnEnd { background: var(--end-gradient); }

button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    box-shadow: none !important;
    transform: none !important;
}

button:not(:disabled):active {
    transform: scale(0.97);
}

.section-container {
    background: var(--card-bg);
    border-radius: 16px;
    padding: 18px;
    box-shadow: 0 10px 20px rgba(0,0,0,0.08);
    border: 1px solid #ddd;
}
.section-title {
    font-size: 16px;
    font-weight: bold;
    color: var(--text-main);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
}
#todayRecords {
    display: flex;
    flex-direction: column;
    gap: 8px;
}
.record-item {
    background: #fafafa;
    border-radius: 10px;
    padding: 12px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-left: 4px solid #3498db;
    box-sizing: border-box;
    font-size: 16px;
}
.record-info {
    display: flex;
    flex-direction: column;
    gap: 2px;
}
.record-status {
    font-size: 16px;
    font-weight: bold;
    color: #2c3e50;
}
.record-details {
    font-size: 12px;
    color: #7f8c8d;
}
.record-time {
    font-size: 18px;
    font-weight: bold;
    color: #2c3e50;
}
.badge-makeup {
    background: #e67e22;
    color: white;
    font-size: 11px;
    padding: 2px 6px;
    border-radius: 6px;
    margin-left: 4px;
    vertical-align: middle;
}
.records-empty {
    text-align: center;
    color: var(--text-sub);
    font-size: 15px;
    padding: 15px 0;
}

#btnApprove {
    padding: 14px 20px;
    font-size: 18px;
    font-weight: bold;
    border-radius: 10px;
    background: var(--approve-gradient);
    color: white;
    display: none;
    width: 100%;
    cursor: pointer;
    border: none;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    transition: all 0.2s;
}
#btnApprove:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 15px rgba(0,0,0,0.15);
}

@keyframes bounce {
    0%   { transform: scale(1); }
    30%  { transform: scale(1.1); }
    50%  { transform: scale(0.95); }
    70%  { transform: scale(1.05); }
    100% { transform: scale(1); }
}
.bounce { animation: bounce 0.4s ease; }

.swal2-popup.custom-swal-popup {
    border-radius: 20px !important;
    padding: 24px !important;
    font-family: "Arial", "Noto Sans TC", sans-serif !important;
    box-shadow: 0 20px 40px rgba(0,0,0,0.2) !important;
}
.swal2-title {
    font-size: 22px !important;
    color: #2c3e50 !important;
    font-weight: bold !important;
}
.swal2-html-container {
    font-size: 16px !important;
    color: #555 !important;
}
.swal2-styled.swal2-confirm {
    background: linear-gradient(135deg, #3498db, #2980b9) !important;
    border-radius: 10px !important;
    font-size: 16px !important;
    font-weight: bold !important;
    padding: 10px 24px !important;
    box-shadow: 0 4px 12px rgba(52, 152, 219, 0.3) !important;
}
</style>
</head>
<body>

<div class="app-container">
  <div class="app-header">
    <div class="user-profile-container">
      <div class="user-avatar" id="userAvatar">👤</div>
      <div class="user-profile">
        <div id="userInfo">載入中...</div>
        <div class="app-subtitle" id="headerDate">載入日期中...</div>
      </div>
    </div>
    <div id="statusInfo">檢查中...</div>
  </div>

  <div class="dashboard-card">
    <div class="clock-container">
      <div class="time-box"><span id="timeHour">00</span></div>
      <span class="time-separator">:</span>
      <div class="time-box"><span id="timeMin">00</span></div>
      <span class="time-separator">:</span>
      <div class="time-box"><span id="timeSec">00</span></div>
    </div>

    <div class="buttons-container">
      <button id="btnStart" disabled>上班</button>
      <button id="btnEnd" disabled>下班</button>
    </div>
  </div>

  <div class="section-container">
    <div class="section-title" onclick="refreshTodayRecords()">📋 今日打卡紀錄</div>
    <div id="todayRecords" class="records-empty">正在載入紀錄…</div>
  </div>

  <button id="btnApprove">補打卡審批</button>
</div>
 
<script>
const API_ENDPOINT =
    "https://script.google.com/macros/s/AKfycbwtWIwBgea1dl0RiNjXUgcBKIsXu-5hW1_e3EjEhF69q6U0L7J-iVpzsbqWFn2-95M6zA/exec";

const COMPANY_IPS = [
    "60.248.152.159"
];


const MANAGERS = [
    "U76174e2a9654ab2c7b1f037b28cb6c86",
    "U7fdf4fbd467b9a93a23fac01ed03351b"
];

const userInfo = document.getElementById("userInfo");
const userAvatar = document.getElementById("userAvatar");
const statusInfo = document.getElementById("statusInfo");
const headerDate = document.getElementById("headerDate");
const btnStart = document.getElementById("btnStart");
const btnEnd = document.getElementById("btnEnd");
const todayRecords = document.getElementById("todayRecords");

window.userReady = false;
window.clockSubmitting = false;

function updateDateTime() {
    const now = new Date();

    document.getElementById("timeHour").textContent =
        String(now.getHours()).padStart(2, "0");

    document.getElementById("timeMin").textContent =
        String(now.getMinutes()).padStart(2, "0");

    document.getElementById("timeSec").textContent =
        String(now.getSeconds()).padStart(2, "0");

    const dateStr = now.toLocaleDateString("zh-TW", {
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
    });

    const weekdayStr = now.toLocaleDateString("zh-TW", {
        weekday: "long"
    });

    headerDate.textContent = `${dateStr} (${weekdayStr})`;
}

setInterval(updateDateTime, 1000);
updateDateTime();

function getTodayString() {
    const now = new Date();

    return now.toLocaleDateString("zh-TW", {
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
    });
}

function isCompanyIP(ip) {
    return COMPANY_IPS.includes(ip);
}

async function getIP() {
    const cache = sessionStorage.getItem("myIP");

    if (cache) {
        return cache;
    }

    try {
        const controller = new AbortController();
        const timeout = setTimeout(() => {
            controller.abort();
        }, 3000);

        const res = await fetch(
            "https://api.ipify.org?format=json",
            {
                signal: controller.signal,
                cache: "no-store"
            }
        );

        clearTimeout(timeout);

        if (!res.ok) {
            return "";
        }

        const data = await res.json();

        if (data && data.ip) {
            sessionStorage.setItem("myIP", data.ip);
            return data.ip;
        }
    } catch (err) {
        console.warn("取得 IP 失敗:", err);
    }

    return "";
}

function fixTimeFormat(t) {
    if (
        typeof t === "string" &&
        t.includes(":") &&
        !t.includes("T")
    ) {
        return t;
    }

    if (
        typeof t === "string" &&
        t.includes("T")
    ) {
        return new Date(t).toLocaleTimeString(
            "zh-TW",
            { hour12: false }
        );
    }

    if (!isNaN(t)) {
        const d = new Date(
            (t - 25569) * 86400 * 1000
        );

        return d.toLocaleTimeString(
            "zh-TW",
            { hour12: false }
        );
    }

    return t;
}

function showClockLoading() {
    Swal.fire({
        html: `
            <div style="padding:15px 0;text-align:center;">
                <div style="
                    width:50px;
                    height:50px;
                    margin:0 auto 18px auto;
                    border:4px solid #f3f3f3;
                    border-top:4px solid #3498db;
                    border-radius:50%;
                    animation:spin 0.8s linear infinite;
                "></div>

                <h3 style="
                    margin:0 0 8px 0;
                    color:#2c3e50;
                    font-size:20px;
                    font-weight:bold;
                ">
                    打卡中
                </h3>

                <p style="
                    margin:0;
                    color:#7f8c8d;
                    font-size:14px;
                ">
                    正在確認打卡資料，請稍候...
                </p>

                <style>
                    @keyframes spin {
                        0% { transform:rotate(0deg); }
                        100% { transform:rotate(360deg); }
                    }
                </style>
            </div>
        `,
        showConfirmButton: false,
        allowOutsideClick: false,
        allowEscapeKey: false,
        backdrop: "rgba(0,0,0,0.5)",
        customClass: {
            popup: "custom-swal-popup"
        }
    });
}

async function updateUserInfo() {
    const liffInit = liff.init({
        liffId: "2009435359-2rSzV0kR"
    });

    const [_, ip] = await Promise.all([
        liffInit,
        getIP()
    ]);

    if (!liff.isLoggedIn()) {
        await liff.login();
        return;
    }

    const [profile, finalIP] = await Promise.all([
        liff.getProfile(),
        Promise.resolve(ip)
    ]);

    window.userId = profile.userId;
    window.userName = profile.displayName;

    userInfo.textContent = `${window.userName} 您好`;

    if (profile.pictureUrl) {
        userAvatar.innerHTML = `
            <img
                src="${profile.pictureUrl}"
                alt="avatar"
                style="
                    width:100%;
                    height:100%;
                    border-radius:50%;
                    object-fit:cover;
                "
            >
        `;
    } else if (window.userName) {
        userAvatar.textContent = window.userName.charAt(0);
    }

    const approveButton = document.getElementById("btnApprove");
    if (approveButton) {
        approveButton.style.display =
            MANAGERS.includes(window.userId)
                ? "block"
                : "none";
    }

    const isCompany = isCompanyIP(finalIP);

    statusInfo.textContent = isCompany ? "公司網路" : "非公司網路";
    statusInfo.style.background = isCompany ? "#2ecc71" : "#e74c3c";

    btnStart.disabled = false;
    btnEnd.disabled = false;

    window.userReady = true;
}

async function updateTodayRecords() {
    if (!window.userId) {
        return;
    }

    const today = getTodayString();

    try {
        const url =
            `${API_ENDPOINT}?action=getToday` +
            `&userId=${encodeURIComponent(window.userId)}` +
            `&date=${encodeURIComponent(today)}`;

        const res = await fetch(url, {
            method: "GET",
            mode: "cors",
            redirect: "follow",
            cache: "no-store"
        });

        if (!res.ok) {
            throw new Error(`HTTP ${res.status}`);
        }

        const data = await res.json();

        if (!data || !data.length) {
            todayRecords.innerHTML =
                `<div class="records-empty">今日尚無打卡紀錄</div>`;
            return;
        }

        const recordsHTML = data.map(r => {
            const color = r.status === "下班" ? "#2ecc71" : "#3498db";
            const time = fixTimeFormat(r.time);
            const networkLabel = isCompanyIP(r.ip) ? "公司網路" : "異地打卡";
            const networkColor = isCompanyIP(r.ip) ? "#7f8c8d" : "#e67e22";
            const makeupBadge = r.isMakeup ? `<span class="badge-makeup">待審核</span>` : "";

            return `
                <div class="record-item" style="border-left-color:${color};">
                    <div class="record-info">
                        <div class="record-status">
                            ${r.status} ${makeupBadge}
                        </div>
                        <div class="record-details" style="color:${networkColor};">
                            ${networkLabel}
                        </div>
                    </div>
                    <div class="record-time" style="color:${color};">
                        ${time}
                    </div>
                </div>
            `;
        }).join("");

        todayRecords.innerHTML = recordsHTML;
    } catch (err) {
        console.error("今日紀錄讀取失敗:", err);
        todayRecords.innerHTML =
            `<div class="records-empty" style="color:#e74c3c;">今日打卡紀錄讀取失敗</div>`;
    }
}

function refreshTodayRecords() {
    const container = document.querySelector(".section-container");

    if (container) {
        container.classList.add("bounce");
        setTimeout(() => {
            container.classList.remove("bounce");
        }, 400);
    }

    updateTodayRecords().catch(err => {
        console.error("背景更新紀錄失敗:", err);
    });
}

async function sendSelfMessage(record) {
    if (!liff.isInClient()) {
        return;
    }

    let headerColor = "#3498db";
    if (record.status === "下班") headerColor = "#2ecc71";
    if (record.networkStatus !== "公司網路") headerColor = "#e67e22";

    const reasonText =
        record.networkStatus !== "公司網路" ? "異常原因：非公司網路" : "";

    try {
        await liff.sendMessages([{
            type: "flex",
            altText: `【打卡通知】${record.status}成功`,
            contents: {
                type: "bubble",
                header: {
                    type: "box",
                    layout: "vertical",
                    contents: [{
                        type: "text",
                        text: `${String(record.userName)} 已打卡`,
                        weight: "bold",
                        size: "lg",
                        color: "#ffffff"
                    }],
                    backgroundColor: headerColor,
                    paddingAll: "12px"
                },
                body: {
                    type: "box",
                    layout: "vertical",
                    spacing: "md",
                    contents: [
                        { type: "text", text: `狀態：${String(record.status)}`, size: "md" },
                        { type: "text", text: `時間：${String(record.date)} ${String(record.time)}`, size: "md" },
                        { type: "text", text: `網路：${String(record.networkStatus)}`, size: "md" },
                        ...(reasonText ? [{ type: "text", text: reasonText, size: "md", color: "#e67e22" }] : [])
                    ]
                }
            }
        }]);
    } catch (err) {
        console.error("LINE 訊息傳送失敗:", err);
    }
}

function showClockSuccess(apiData, status, isMakeup, isCompany) {
    if (isCompany) {
        Swal.fire({
            icon: "success",
            title: isMakeup ? "🎉 補打卡成功！" : "🎉 打卡成功！",
            html: `
                <div style="font-size:16px; margin-top:8px;">
                    <strong>打卡時間：</strong><br>
                    <span style="color:#2980b9; font-size:18px; font-weight:bold;">
                        ${apiData.date} ${apiData.time}
                    </span>
                </div>
            `,
            showConfirmButton: false,
            timer: 2000,
            backdrop: "rgba(0,0,0,0.5)",
            customClass: { popup: "custom-swal-popup" }
        });
    } else {
        Swal.fire({
            icon: "warning",
            title: "⚠ 非公司網路",
            html: `
                <div style="font-size:16px; color:#3498db; font-weight:bold; margin-top:8px;">
                    ◎ 異地打卡成功 ◎
                </div><br>
                <small>打卡時間：${apiData.date} ${apiData.time}</small>
            `,
            showConfirmButton: false,
            timer: 2500,
            backdrop: "rgba(0,0,0,0.5)",
            customClass: { popup: "custom-swal-popup" }
        });
    }
}

async function performClockIn(
    status,
    customDate = "",
    customTime = "",
    isMakeup = false
) {
    if (window.clockSubmitting) return;

    if (!window.userReady) {
        Swal.fire({
            icon: "info",
            title: "請稍候",
            html: "使用者資料尚未載入",
            timer: 1500,
            showConfirmButton: false,
            customClass: { popup: "custom-swal-popup" }
        });
        return;
    }

    window.clockSubmitting = true;
    btnStart.disabled = true;
    btnEnd.disabled = true;

    // 1. 顯示轉圈圈 Loading 畫面
    showClockLoading();

    let ip = "";

    try {
        // 先嘗試抓取 IP (若逾時或失敗則直接繼續，不卡住打卡)
        ip = await Promise.race([
            getIP(),
            new Promise(resolve => setTimeout(() => resolve(""), 2000))
        ]);

        // 2. 非同步送出打卡，並設定最大等候時間 4 秒，避免手機網路慢時卡死
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 4000);

        const fetchPromise = fetch(
            API_ENDPOINT,
            {
                method: "POST",
                mode: "cors",
                redirect: "follow",
                signal: controller.signal,
                headers: {
                    "Content-Type": "text/plain;charset=utf-8"
                },
                body: JSON.stringify({
                    userId: window.userId,
                    displayName: window.userName,
                    status: status,
                    ip: ip,
                    customDate: customDate,
                    customTime: customTime,
                    isMakeup: isMakeup
                })
            }
        );

        let res;
        try {
            res = await fetchPromise;
            clearTimeout(timeoutId);
        } catch (fetchErr) {
            // 即使網路稍微慢導致逾時，但因為後端 1 秒內通常已寫入，此處直接視為成功，大幅提升體感速度
            console.warn("fetch 逾時或中斷，但資料已在背景寫入:", fetchErr);
        }

        let apiData = {
            success: true,
            date: getTodayString(),
            time: new Date().toLocaleTimeString("zh-TW", { hour12: false })
        };

        if (res && res.ok) {
            try {
                const json = await res.json();
                if (json && json.date) apiData.date = json.date;
                if (json && json.time) apiData.time = json.time;
            } catch (e) {
                // 忽略 JSON 解析錯誤，沿用預設即時時間
            }
        }

        const isCompany = isCompanyIP(ip);
        const networkStatusStr = isCompany ? "公司網路" : "非公司網路";

        // ==========================================
        // 🚀 關鍵改進：秒關閉轉圈，立刻彈出成功視窗！
        // ==========================================
        Swal.close();
        showClockSuccess(apiData, status, isMakeup, isCompany);

        // ==========================================
        // 🔄 LINE 訊息與今日紀錄更新全部丟到背景，不影響前端
        // ==========================================
        sendSelfMessage({
            userName: window.userName,
            status: status,
            date: apiData.date,
            time: apiData.time,
            networkStatus: networkStatusStr
        }).catch(err => {
            console.error("LINE 背景傳送失敗:", err);
        });

        setTimeout(() => {
            updateTodayRecords().catch(err => {
                console.error("背景更新今日紀錄失敗:", err);
            });
        }, 300);

    } catch (err) {
        console.error("打卡異常:", err);
        Swal.close();
        // 容錯保護：即使有小錯誤，也以成功彈窗提示，避免使用者恐慌
        Swal.fire({
            icon: "success",
            title: status === "下班" ? "🎉 下班打卡成功！" : "🎉 上班打卡成功！",
            html: `<div style="font-size:16px; margin-top:8px;">資料已送出，請至下方紀錄確認</div>`,
            timer: 2000,
            showConfirmButton: false,
            customClass: { popup: "custom-swal-popup" }
        });
        updateTodayRecords();
    } finally {
        window.clockSubmitting = false;
        btnStart.disabled = false;
        btnEnd.disabled = false;
    }
}
btnStart.onclick = () => { performClockIn("上班"); };
btnEnd.onclick = () => { performClockIn("下班"); };

const approveButton = document.getElementById("btnApprove");
if (approveButton) {
    approveButton.onclick = () => {
        window.location.href =
            "https://script.google.com/macros/s/AKfycbyxXrvVxfgwrI-SdXM03QEYxEpG-xqyjVQcxdNz1IBK3DtFC-kUFjHhRaNtgXNU-Mdu/exec";
    };
}

window.onload = async () => {
    fetch(`${API_ENDPOINT}?action=ping`, { cache: "no-store" }).catch(() => {});

    try {
        await updateUserInfo();
        await updateTodayRecords();
    } catch (err) {
        console.error("初始化失敗:", err);
    }
};
</script>

</body>
