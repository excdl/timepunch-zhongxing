<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>奇可智能打卡系統</title>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>
body { 
    font-family: Arial, "Noto Sans TC", sans-serif; 
    background:#f7f7f7;
    display:flex; 
    justify-content:center; 
    padding:25px; 
    margin:0;
    color: #2c3e50;
}

/* === 卡片容器（整個頁面） === */
.card {
    background:white;
    width:95%;
    max-width:480px;
    box-shadow:0 8px 25px rgba(0,0,0,0.12);
    border-radius:18px;
    padding:25px 20px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:20px;
}

/* 日期 / 使用者 / 狀態 */
#dateTime { font-size:22px; }
#userInfo { font-size:26px; font-weight:bold; }
#statusInfo { 
    font-size:20px;
    padding:6px 18px; 
    border-radius:30px; 
    display:inline-block;
    font-weight:bold;
}

/* 按鈕區 */
.buttons-container {
    width:100%;
    display:flex;
    gap:12px;
}

button { 
    flex:1;
    padding:12px 0; 
    font-size:20px; 
    border-radius:10px; 
    cursor:pointer; 
    font-weight:bold; 
    border:none;
    transition:0.22s;
    color: white;
}

/* 按鈕特效 */
button:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 14px rgba(0,0,0,0.12);
}

/* 按鈕顏色：上班橘紅、下班藍 */
#btnStart { background: linear-gradient(145deg, #ff9f43, #ee5253); }
#btnEnd { background: linear-gradient(145deg, #3498db, #2980b9); }

/* 倒數動畫 */
#countdownWrapper { 
    width:130px; 
    height:130px; 
    position:relative; 
    display:none; 
}
#circleProgress { 
    fill:none; 
    stroke-width:12; 
    stroke-linecap:round; 
    transform: rotate(-90deg);
    transform-origin: center;
}
#countdownText { 
    position:absolute; 
    top:50%; 
    left:50%; 
    transform:translate(-50%,-50%); 
    font-weight:bold; 
    font-size:18px;
}

/* 今日打卡紀錄區塊 */
.section-container {
    background: #ffffff;
    border-radius: 16px;
    padding: 15px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    border: 1px solid #ddd;
    width: 100%;
    box-sizing: border-box;
}
.section-title {
    font-size: 16px;
    font-weight: bold;
    color: #2c3e50;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
}
#todayRecords {
    display: flex;
    flex-direction: column;
    gap: 8px;
}
.record-item {
    background: #fafafa;
    border-radius: 10px;
    padding: 12px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-left: 4px solid #3498db;
    box-sizing: border-box;
    font-size: 16px;
}
.record-info {
    display: flex;
    flex-direction: column;
    gap: 2px;
}
.record-status {
    font-size: 16px;
    font-weight: bold;
    color: #2c3e50;
}
.record-details {
    font-size: 12px;
    color: #7f8c8d;
}
.record-time {
    font-size: 18px;
    font-weight: bold;
    color: #2c3e50;
}
.badge-makeup {
    background: #e67e22;
    color: white;
    font-size: 11px;
    padding: 2px 6px;
    border-radius: 6px;
    margin-left: 4px;
    vertical-align: middle;
}
.records-empty {
    text-align: center;
    color: #7f8c8d;
    font-size: 15px;
    padding: 15px 0;
}

/* 主管按鈕 */
#btnApprove {
    margin-top:10px;
    padding:14px 20px;
    font-size:20px;
    border-radius:12px;
    background:linear-gradient(145deg,#8e44ad,#663399);
    color:white;
    width:100%;
    border:none;
    cursor:pointer;
    font-weight:bold;
    display:none;
}
#btnApprove:hover {
    transform: translateY(-3px);
    box-shadow:0 8px 14px rgba(0,0,0,0.12);
}

/* SweetAlert2 自訂外觀 */
.swal2-popup.custom-swal-popup {
    border-radius: 20px !important;
    padding: 24px !important;
    font-family: "Arial", "Noto Sans TC", sans-serif !important;
    box-shadow: 0 20px 40px rgba(0,0,0,0.2) !important;
}
.swal2-title {
    font-size: 22px !important;
    color: #2c3e50 !important;
    font-weight: bold !important;
}
.swal2-html-container {
    font-size: 16px !important;
    color: #555 !important;
}
.swal2-styled.swal2-confirm {
    background: linear-gradient(135deg, #3498db, #2980b9) !important;
    border-radius: 10px !important;
    font-size: 16px !important;
    font-weight: bold !important;
    padding: 10px 24px !important;
    box-shadow: 0 4px 12px rgba(52, 152, 219, 0.3) !important;
}

/* 響應式 */
@media(max-width:420px){
    button { font-size:18px; }
    #userInfo { font-size:22px; }
}

/* 點擊跳動動畫 */
@keyframes bounce {
    0%   { transform: scale(1); }
    30%  { transform: scale(1.1); }
    50%  { transform: scale(0.95); }
    70%  { transform: scale(1.05); }
    100% { transform: scale(1); }
}
.bounce {
    animation: bounce 0.4s ease;
}
</style>
</head>

<body>

<div class="card">
    <div id="userInfo">正在獲取使用者資訊...</div>
    <div id="statusInfo"></div>
    <div id="dateTime">載入中…</div>

    <div class="buttons-container">
        <button id="btnStart">上班</button>
        <button id="btnEnd">下班</button>
    </div>

    <div id="countdownWrapper">
        <svg width="130" height="130">
            <defs>
                <linearGradient id="gradStart" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#ff9f43; stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#ee5253; stop-opacity:1" />
                </linearGradient>
                <linearGradient id="gradEnd" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#3498db; stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#2980b9; stop-opacity:1" />
                </linearGradient>
            </defs>
            <circle id="circleProgress" cx="65" cy="65" r="55"></circle>
        </svg>
        <div id="countdownText">打卡中...</div>
    </div>

    <!-- 今日打卡紀錄卡片容器 -->
    <div class="section-container">
        <div class="section-title" onclick="refreshTodayRecords()">📋 今日打卡紀錄 (點擊可刷新)</div>
        <div id="todayRecords" class="records-empty">正在載入紀錄…</div>
    </div>

    <button id="btnApprove">補打卡審批</button>
</div>

<script>
// ===== 設定 =====
const API_ENDPOINT = "https://script.google.com/macros/s/AKfycbw9grUDCa7Knd7dp4DnaPQaXuybqNBpIswdsuCh25fkUOvrpxVDm-jp0bu8SJyOYthCew/exec";
const COMPANY_IPS  = ["60.248.152.159","27.247.229.25"];
// ===== 主管 USER_ID =====
const MANAGERS = [
    "U76174e2a9654ab2c7b1f037b28cb6c86", "U7fdf4fbd467b9a93a23fac01ed03351b"
];

// ====== 更新日期時間 ======
function updateDateTime() {
    const now = new Date();
    document.getElementById("dateTime").textContent = now.toLocaleString("zh-TW", { hour12: false });
}
setInterval(updateDateTime, 1000);
updateDateTime();

// ====== 取得今日日期字串格式 ======
function getTodayString() {
    const now = new Date();
    return now.toLocaleDateString("zh-TW", { year: 'numeric', month: '2-digit', day: '2-digit' }).replace(/\//g, "/");
}

// ====== 更快的 IP 取得 ======
async function getIP() {
    const cache = sessionStorage.getItem("myIP");
    if (cache) return cache;

    try {
        const res = await fetch("https://api.ipify.org?format=json");
        const data = await res.json();
        sessionStorage.setItem("myIP", data.ip);
        return data.ip;
    } catch {
        return "";
    }
}

// ====== 時間格式處理 ======
function fixTimeFormat(t) {
    if (typeof t === "string" && t.includes(":") && !t.includes("T")) return t;
    if (typeof t === "string" && t.includes("T")) return new Date(t).toLocaleTimeString("zh-TW", { hour12: false });
    if (!isNaN(t)) {
        const d = new Date((t - 25569) * 86400 * 1000);
        return d.toLocaleTimeString("zh-TW", { hour12: false });
    }
    return t;
}

// ====== 按鈕 ======
const btnStart = document.getElementById("btnStart");
const btnEnd   = document.getElementById("btnEnd");
const todayRecords = document.getElementById("todayRecords");

btnStart.disabled = true;
btnEnd.disabled = true;
window.userReady = false;

// ====== 主要：極速取得使用者資訊 + IP ======
async function updateUserInfo() {
    const liffInit = liff.init({ liffId: "2009435359-2rSzV0kR" });

    const [_, ip] = await Promise.all([
        liffInit,
        getIP()
    ]);

    if (!liff.isLoggedIn()) {
        await liff.login();
    }

    const [profile, finalIP] = await Promise.all([
        liff.getProfile(),
        getIP()
    ]);

    window.userId = profile.userId;
    window.userName = profile.displayName;

    document.getElementById("userInfo").textContent = `${window.userName} 您好`;
    document.getElementById("btnApprove").style.display = MANAGERS.includes(window.userId) ? "block" : "none";

    const s = document.getElementById("statusInfo");
    const isCompany = COMPANY_IPS.includes(finalIP);

    s.textContent = isCompany ? "公司網路" : "非公司網路";
    s.style.color = isCompany ? "#008000" : "#FF0000";
    s.style.backgroundColor = isCompany ? "rgba(144,238,144,0.6)" : "rgba(255,182,193,0.3)";
    s.style.padding = "5px 15px";
    s.style.borderRadius = "20px";
    s.style.display = "inline-block";
    s.style.fontWeight = "bold";

    btnStart.disabled = false;
    btnEnd.disabled = false;
    window.userReady = true;
}

/* ===== 今日紀錄渲染函式 ===== */
async function updateTodayRecords(){
  if (!window.userId) return;
  
  try {
    const res = await fetch(`${API_ENDPOINT}?action=getToday&userId=${window.userId}&date=${getTodayString()}`);
    const data = await res.json();

    if (!data || !data.length) {
      todayRecords.innerHTML = `<div class="records-empty">今日尚無打卡紀錄</div>`;
      return;
    }

    const recordsHTML = data.map(r => {
      let color = r.status === "下班" ? "#2ecc71" : "#3498db";
      const time = fixTimeFormat(r.time);
      
      // 依據後端傳回的打卡位置/網路狀態調整顯示文字
      // 假設後端回傳的欄位叫 r.company 或 r.network，若有記錄公司名稱則顯示「公司網路」，否則顯示「異地打卡」
      let networkText = "異地打卡";
      if (r.company && COMPANY_IPS.includes(r.company) || r.company === "公司網路") {
          networkText = "公司網路";
      } else if (!r.company || r.company === "" || r.company === "一般打卡") {
          // 如果原本是空值或一般打卡，可根據您後端是否有存 IP 來判斷，或者預設轉為「異地打卡」
          networkText = "異地打卡"; 
      } else {
          networkText = r.company; // 如果有特定公司名稱則直接顯示
      }

      const makeupBadge = r.isMakeup ? `<span class="badge-makeup">待審核</span>` : "";
      
      return `
        <div class="record-item" style="border-left-color: ${color};">
          <div class="record-info">
            <div class="record-status">${r.status} ${makeupBadge}</div>
            <div class="record-details">${networkText}</div>
          </div>
          <div class="record-time" style="color: ${color};">${time}</div>
        </div>
      `;
    }).join("");

    todayRecords.innerHTML = recordsHTML;
  } catch (err) {
    console.error(err);
    todayRecords.innerHTML = `<div class="records-empty" style="color: #e74c3c;">今日打卡紀錄讀取失敗</div>`;
  }
}

function refreshTodayRecords() {
    const container = document.querySelector(".section-container");
    container.classList.add("bounce");
    setTimeout(() => {
        container.classList.remove("bounce");
    }, 400);
    updateTodayRecords();
}

/* ===== 打卡後發送 Flex Message 給自己 ===== */
async function sendSelfMessage(record) {
    if (!liff.isInClient()) return;

    let headerColor = "#3498db"; 
    if (record.status === "下班") headerColor = "#2ecc71"; 
    if (record.networkStatus !== "公司網路") headerColor = "#e67e22"; 

    let reasonText = record.networkStatus !== "公司網路" ? "異常原因：非公司網路" : "";

    try {
        await liff.sendMessages([{
            type: 'flex',
            altText: '打卡通知',
            contents: {
                type: "bubble",
                header: {
                    type: "box",
                    layout: "vertical",
                    contents: [{
                        type: "text",
                        text: `${record.userName} 已打卡`,
                        weight: "bold",
                        size: "lg",
                        color: "#ffffff"
                    }],
                    backgroundColor: headerColor,
                    paddingAll: "12px"
                },
                body: {
                    type: "box",
                    layout: "vertical",
                    spacing: "md",
                    contents: [
                        { type: "text", text: `狀態：${record.status}`, size: "md" },
                        { type: "text", text: `時間：${record.date} ${record.time}`, size: "md" },
                        { type: "text", text: `網路：${record.networkStatus}`, size: "md" },
                        ...(reasonText ? [{ type: "text", text: reasonText, size: "md", color: "#e67e22" }] : [])
                    ]
                }
            }
        }]);
        await new Promise(r => setTimeout(r, 800));
    } catch(err) {
        console.error("LIFF 訊息傳送失敗:", err);
    }
}

// ===== 打卡函式 =====
async function performClockIn(status, customDate = "", customTime = "", isMakeup = false) {
    if (!window.userReady) {
        Swal.fire({ 
            icon:"info", 
            title:"請稍候", 
            html:"使用者資料尚未載入", 
            timer:1500, 
            showConfirmButton:false,
            customClass: { popup: 'custom-swal-popup' }
        });
        return;
    }

    const ip = await getIP();

    Swal.fire({
        html: `
            <div style="padding: 15px 0; text-align: center;">
                <div style="width: 50px; height: 50px; margin: 0 auto 18px auto; border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
                <h3 style="margin: 0 0 8px 0; color: #2c3e50; font-size: 20px; font-weight: bold;">系統打卡處理中</h3>
                <p style="margin: 0; color: #7f8c8d; font-size: 14px;">正在與雲端伺服器安全同步，請稍候...</p>
                <style>@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>
            </div>
        `,
        showConfirmButton: false,
        allowOutsideClick: false,
        allowEscapeKey: false,
        backdrop: "rgba(0,0,0,0.5)",
        customClass: { popup: 'custom-swal-popup' }
    });

    let apiData = null;
    try {
        const res = await fetch(API_ENDPOINT, {
            method: "POST",
            body: JSON.stringify({ userId: window.userId, displayName: window.userName, status, ip, customDate, customTime, isMakeup })
        });
        apiData = await res.json();
    } catch(err) {
        console.error(err);
        apiData = { message:"失敗" };
    }

    if (apiData.message && apiData.message.includes("成功")) {
        const isCompany = COMPANY_IPS.includes(ip);
        const networkStatusStr = isCompany ? "公司網路" : "非公司網路";

        await sendSelfMessage({
            userName: window.userName,
            status: status,
            date: apiData.date,
            time: apiData.time,
            networkStatus: networkStatusStr
        });

        if (isCompany) {
            Swal.fire({
                icon: "success",
                title: isMakeup ? "🎉 補打卡成功！" : "🎉 打卡成功！",
                html: `<div style="font-size: 16px; margin-top: 8px;"><strong>打卡時間：</strong><br><span style="color: #2980b9; font-size: 18px; font-weight: bold;">${apiData.date} ${apiData.time}</span></div>`,
                showConfirmButton: false,
                timer: 2000,
                backdrop: "rgba(0,0,0,0.5)",
                customClass: { popup: 'custom-swal-popup' }
            });
        } else {
            Swal.fire({
                icon: "warning",
                title: "⚠ 非公司網路",
                html: `<div style="font-size:16px;color:#3498db;font-weight:bold;margin-top:8px;">◎ 異地打卡成功 ◎</div><br><small>打卡時間：${apiData.date} ${apiData.time}</small>`,
                showConfirmButton: false,
                timer: 2500,
                backdrop: "rgba(0,0,0,0.5)",
                customClass: { popup: 'custom-swal-popup' }
            });
        }
    } else {
        Swal.fire({
            icon: "error",
            title: "打卡失敗",
            text: "請檢查網路連線或重新整理頁面試試看！",
            confirmButtonText: "確定",
            customClass: { popup: 'custom-swal-popup' }
        });
    }

    updateTodayRecords();
}

// ===== 按鈕事件 =====
document.getElementById("btnStart").onclick = () => performClockIn("上班");
document.getElementById("btnEnd").onclick = () => performClockIn("下班");

document.getElementById("btnApprove").onclick = () => {
    window.location.href = "https://script.google.com/macros/s/AKfycbyxXrvVxfgwrI-SdXM03QEYxEpG-xqyjVQcxdNz1IBK3DtFC-kUFjHhRaNtgXNU-Mdu/exec";
};

// ===== 初始化 (包含自動載入打卡紀錄) =====
window.onload = async () => {
    await updateUserInfo();
    await updateTodayRecords();
};
</script>
</body>
</html>
